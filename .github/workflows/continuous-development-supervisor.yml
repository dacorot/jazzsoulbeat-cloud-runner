name: Continuous development supervisor

on:
  schedule:
    - cron: "15 */6 * * *"
  push:
    paths:
      - "DEVELOPMENT_SUPERVISOR_START.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-development-supervisor
  cancel-in-progress: false

jobs:
  audit-and-improve:
    name: Audit, test, diagnose and report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref || 'fix/real-music-and-cinematic-motion' }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Check out private development agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install private agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Run public controller tests
        id: public_tests
        continue-on-error: true
        run: |
          set +e
          mkdir -p output/development
          PYTHONPATH=. pytest -q > output/development/public-tests.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run private agent compile and tests
        id: private_tests
        continue-on-error: true
        working-directory: agent
        run: |
          set +e
          mkdir -p output/development
          python -m compileall -q . > output/development/private-compile.txt 2>&1
          compile_code=$?
          python -m unittest discover -s tests -v > output/development/private-tests.txt 2>&1
          test_code=$?
          printf '{"compile_exit":%s,"test_exit":%s}\n' "$compile_code" "$test_code" > output/development/private-test-status.json
          echo "exit_code=$((compile_code || test_code))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply safe corrections immediately
        id: safe_remediation
        continue-on-error: true
        working-directory: agent
        run: |
          set +e
          mkdir -p output/development
          python main.py migrate-manifests > output/development/safe-migrate-manifests.txt 2>&1
          migration_code=$?
          python main.py inventory-assets > output/development/safe-inventory-assets.txt 2>&1
          inventory_code=$?
          printf '{"migration_exit":%s,"inventory_exit":%s}\n' "$migration_code" "$inventory_code" > output/development/safe-remediation-status.json
          echo "exit_code=$((migration_code || inventory_code))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run architecture and PDCA audits
        id: audits
        continue-on-error: true
        working-directory: agent
        run: |
          set +e
          mkdir -p output/development
          python main.py autonomy-status > output/development/autonomy-status.txt 2>&1
          autonomy_code=$?
          python main.py ledger-status > output/development/ledger-status.txt 2>&1
          ledger_code=$?
          python main.py deming-agent --root . > output/development/deming-status.txt 2>&1
          deming_code=$?
          python main.py inventory-assets > output/development/asset-inventory.txt 2>&1
          inventory_code=$?
          printf '{"autonomy_exit":%s,"ledger_exit":%s,"deming_exit":%s,"inventory_exit":%s}\n' "$autonomy_code" "$ledger_code" "$deming_code" "$inventory_code" > output/development/audit-status.json
          echo "exit_code=$((autonomy_code || ledger_code || deming_code || inventory_code))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build canonical artifact inventory
        id: artifact_inventory
        continue-on-error: true
        run: |
          set +e
          python scripts/artifact_inventory_agent.py > output/development/canonical-inventory.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run readiness and pipeline-health audits
        id: readiness
        continue-on-error: true
        run: |
          set +e
          mkdir -p output/development
          python scripts/agent_readiness.py --root . --output output/development/public-readiness.json > output/development/public-readiness.txt 2>&1
          readiness_code=$?
          python scripts/pipeline_health_agent.py --root . --report output/development/pipeline-health.json > output/development/pipeline-health.txt 2>&1
          health_code=$?
          printf '{"readiness_exit":%s,"pipeline_health_exit":%s}\n' "$readiness_code" "$health_code" > output/development/public-audit-status.json
          echo "exit_code=$((readiness_code || health_code))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Produce PDCA report
        if: always()
        env:
          PUBLIC_TESTS: ${{ steps.public_tests.outputs.exit_code }}
          PRIVATE_TESTS: ${{ steps.private_tests.outputs.exit_code }}
          SAFE_REMEDIATION: ${{ steps.safe_remediation.outputs.exit_code }}
          AUDITS: ${{ steps.audits.outputs.exit_code }}
          READINESS: ${{ steps.readiness.outputs.exit_code }}
          ARTIFACT_INVENTORY: ${{ steps.artifact_inventory.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          values = {
              "agent_id": "continuous_development_supervisor",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "cycle": "PDCA",
              "policy": {
                  "safe_auto_remediation": True,
                  "automatic_publication": False,
                  "automatic_deletion": False,
                  "automatic_secret_changes": False,
                  "source_changes_require_review": True,
              },
              "exit_codes": {
                  "public_tests": os.environ.get("PUBLIC_TESTS"),
                  "private_tests": os.environ.get("PRIVATE_TESTS"),
                  "safe_remediation": os.environ.get("SAFE_REMEDIATION"),
                  "architecture_audits": os.environ.get("AUDITS"),
                  "readiness_audits": os.environ.get("READINESS"),
                  "artifact_inventory": os.environ.get("ARTIFACT_INVENTORY"),
              },
          }
          failed = [name for name, value in values["exit_codes"].items() if value not in {"0", "", None}]
          values["status"] = "HEALTHY" if not failed else "ACTION_REQUIRED"
          values["actions_required"] = failed
          out = Path("output/development")
          out.mkdir(parents=True, exist_ok=True)
          (out / "latest.json").write_text(json.dumps(values, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(values, indent=2))
          PY

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-${{ github.run_id }}
          path: |
            output/development/
            agent/output/development/
          if-no-files-found: warn
          retention-days: 30
