name: Jazz Soul Beat weekly and long-range KPI review

on:
  schedule:
    # Monday 08:17 Colombia (UTC-5).
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-performance-review
  cancel-in-progress: false

jobs:
  performance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start weekly PDCA review
        id: pdca_start
        uses: ./.github/actions/pdca-start
        with:
          task: weekly-performance-review
          objective: Compare observed 7-day, 30-day and 90-day KPIs, identify recurring defects and record measurable improvement actions
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
      - name: Generate weekly, monthly and quarterly rolling KPI reports
        id: reports
        working-directory: agent
        run: |
          python main.py performance-report --days 7 --save
          python main.py performance-report --days 30 --save
          python main.py performance-report --days 90 --save
          test -n "$(find output/performance -type f -name 'PERFORMANCE_REPORT_7D_*.json' -print -quit)"
          test -n "$(find output/performance -type f -name 'PERFORMANCE_REPORT_30D_*.json' -print -quit)"
          test -n "$(find output/performance -type f -name 'PERFORMANCE_REPORT_90D_*.json' -print -quit)"
      - name: Verify and close weekly PDCA review
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"weekly-performance-review","run_id":"${{ github.run_id }}","report_generation":"${{ steps.reports.outcome }}"}'
          checks_json: >-
            [{"name":"seven_day_kpi_report","passed":${{ steps.reports.outcome == 'success' }}},{"name":"thirty_day_kpi_report","passed":${{ steps.reports.outcome == 'success' }}},{"name":"ninety_day_kpi_report","passed":${{ steps.reports.outcome == 'success' }}}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; weekly, monthly and quarterly rolling KPI report files'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
      - name: Persist KPI reports to private Drive
        if: ${{ always() && steps.reports.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-qa
          python main.py drive-status
      - name: Confirm governance-only workflow
        if: always()
        run: |
          echo "KPI review only. No music rights are approved and no YouTube publication is performed."
