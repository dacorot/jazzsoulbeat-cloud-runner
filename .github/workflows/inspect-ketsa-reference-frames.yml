name: Inspect private Ketsa review frames (no publish)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ketsa-reference-frames.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Restore only the private Ketsa review MP4 from Drive
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          from googleapiclient.http import MediaIoBaseDownload
          sys.path.insert(0, "agent")
          from drive_storage import DriveStore
          store = DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"], root=Path("agent"))
          file_id = "16N3Aes3bcsCFFZcoMTni-89EC5DdfH8C"
          metadata = store.service.files().get(
              fileId=file_id,
              fields="id,name,mimeType,size,modifiedTime,webViewLink",
          ).execute(num_retries=2)
          if metadata.get("mimeType") != "video/mp4":
              raise SystemExit(f"Expected private MP4; got {metadata.get('mimeType')!r}")
          expected = Path("agent/output/ketsa-review/KETSA_AUDITION_VIDEO.mp4")
          expected.parent.mkdir(parents=True, exist_ok=True)
          request = store.service.files().get(fileId=file_id, alt="media")
          with expected.open("wb") as handle:
              downloader = MediaIoBaseDownload(handle, request, chunksize=10 * 1024 * 1024)
              done = False
              while not done:
                  status, done = downloader.next_chunk(num_retries=2)
                  if status:
                      print(f"Drive download: {status.progress():.0%}")
          actual_size = expected.stat().st_size
          if metadata.get("size") and actual_size != int(metadata["size"]):
              raise SystemExit(f"Drive MP4 size mismatch: expected {metadata['size']}, got {actual_size}")
          print({"metadata": metadata, "downloaded_bytes": actual_size})
          PY
        working-directory: .
      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Extract first frame and 60-second loop boundary frames
        run: |
          mkdir -p review-frames
          VIDEO="agent/output/ketsa-review/KETSA_AUDITION_VIDEO.mp4"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json "$VIDEO" > review-frames/video-metadata.json
          ffmpeg -nostdin -y -loglevel error -ss 0 -i "$VIDEO" -frames:v 1 -q:v 2 review-frames/frame-0000.jpg
          ffmpeg -nostdin -y -loglevel error -ss 59.933333 -i "$VIDEO" -frames:v 1 -q:v 2 review-frames/frame-0899.jpg
          ffmpeg -nostdin -y -loglevel error -ss 60.000000 -i "$VIDEO" -frames:v 1 -q:v 2 review-frames/frame-0900.jpg
          ffmpeg -nostdin -y -loglevel error -ss 60.066667 -i "$VIDEO" -frames:v 1 -q:v 2 review-frames/frame-0901.jpg
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = [
              ("frame-0000.jpg", "Start"),
              ("frame-0899.jpg", "59.933 s"),
              ("frame-0900.jpg", "60.000 s"),
              ("frame-0901.jpg", "60.067 s"),
          ]
          thumbs = []
          for name, label in files:
              p = Path("review-frames") / name
              if not p.is_file():
                  raise SystemExit(f"Missing extracted frame: {p}")
              im = Image.open(p).convert("RGB")
              im.thumbnail((960, 540))
              tile = Image.new("RGB", (980, 590), "white")
              tile.paste(im, ((980-im.width)//2, 15))
              ImageDraw.Draw(tile).text((20, 560), label, fill="black")
              thumbs.append(tile)
          sheet = Image.new("RGB", (1960, 1180), "white")
          for i, tile in enumerate(thumbs):
              sheet.paste(tile, ((i%2)*980, (i//2)*590))
          sheet.save("review-frames/contact-sheet.jpg", quality=92)
          PY
      - name: Upload private inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketsa-visual-reference-frames
          path: review-frames/
          if-no-files-found: error
          retention-days: 7
