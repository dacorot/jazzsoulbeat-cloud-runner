name: Jazz Soul Beat - Live readiness planner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  plan:
    name: Check live eligibility and persist daily plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIGURED: ${{ secrets.YOUTUBE_TOKEN_JSON != '' && secrets.DRIVE_TOKEN_JSON != '' && secrets.PRIVATE_REPO_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip safely when credentials are unavailable
        if: ${{ env.CONFIGURED != 'true' }}
        run: |
          echo "Live readiness skipped: required secrets are unavailable."
      - uses: actions/checkout@v4
        if: ${{ env.CONFIGURED == 'true' }}
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: ${{ env.CONFIGURED == 'true' }}
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: ${{ env.CONFIGURED == 'true' }}
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Generate autonomous daily live plan
        if: ${{ env.CONFIGURED == 'true' }}
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py live-readiness
      - name: Persist live plan privately
        if: ${{ env.CONFIGURED == 'true' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-live-plan
      - name: Safety boundary
        if: always()
        run: |
          echo "This workflow only checks readiness and writes a private plan."
          echo "It does not create, start, stop, or publish a live broadcast."
