name: Jazz Soul Beat - Original Music Producer
on:
  push:
    paths:
      - "MUSIC_PRODUCER_START.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-music-producer
  cancel-in-progress: true
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Gradio client
        run: python -m pip install --upgrade gradio_client
      - name: Generate original instrumental through the free public ACE-Step Space
        env:
          MUSIC_DURATION_SECONDS: "120"
          MUSIC_MAX_WAIT_SECONDS: "2400"
        run: python scripts/music_producer_agent.py
      - name: Validate generated audio and attach diagnostics
        if: always()
        run: |
          mkdir -p music-production
          if compgen -G "music-production/generated/*" > /dev/null; then
            for f in music-production/generated/*; do
              ffprobe -v error -show_entries format=duration,size -of json "$f" > "${f}.ffprobe.json" || true
            done
          fi
      - name: Checkout private agent for private Drive persistence
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Install private Drive sync dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Copy original-music report and audio into private output library
        run: |
          mkdir -p "agent/output/original-music/run-${{ github.run_id }}"
          cp -a music-production/. "agent/output/original-music/run-${{ github.run_id }}/"
      - name: Persist original-music result and diagnostics to private Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status
      - name: Confirm human-review and publication gates
        if: always()
        run: |
          echo "Generated music remains unapproved until the user listens and approves it."
          echo "No public workflow artifact, YouTube upload, or public publication is created."
