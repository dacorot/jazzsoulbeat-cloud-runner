name: Jazz Soul Beat - Original Music Producer
on:
  push:
    paths:
      - "MUSIC_PRODUCER_START.md"
  workflow_dispatch:
  schedule:
    # Tue/Thu/Sat 08:30 America/Bogota. Quotas may prevent successful generation.
    - cron: "30 13 * * 2,4,6"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-music-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Gradio client
        run: python -m pip install --upgrade gradio_client
      - name: Rotate original jazz styles on each production day
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from scripts.music_briefs import BRIEFS
          import os
          today = datetime.now(ZoneInfo("America/Bogota")).date()
          category = list(BRIEFS)[today.toordinal() % len(BRIEFS)]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MUSIC_CATEGORY={category}\n")
          print(f"Scheduled original-music audition: {today.isoformat()}, category {category}")
          PY
      - name: Generate original instrumental through the free public ACE-Step Space
        id: generate_music
        env:
          MUSIC_DURATION_SECONDS: "240"
          ACE_STEP_SPACE: "Blursed/Ace-Step-v1.5"
          ACE_STEP_MODEL: "acestep-v15-turbo"
          MUSIC_MAX_WAIT_SECONDS: "900"
        run: timeout --signal=TERM --kill-after=15s "${MUSIC_MAX_WAIT_SECONDS}s" python -m scripts.music_producer_agent
      - name: Validate generated audio and attach diagnostics
        if: always()
        run: |
          mkdir -p music-production
          status="${{ job.status }}"
          printf '{"workflow":"original-music-producer","run_id":"%s","generation_step":"%s","job_status":"%s","publication":"disabled"}\n' "${GITHUB_RUN_ID}" "${{ steps.generate_music.outcome }}" "$status" > music-production/PRODUCER_RUN_DIAGNOSTICS.json
          if compgen -G "music-production/generated/*" > /dev/null; then
            for f in music-production/generated/*; do
              if [ -f "$f" ]; then
                ffprobe -v error -show_entries format=duration,size -of json "$f" > "${f}.ffprobe.json" || echo "ffprobe failed for $f" >> music-production/VALIDATION_ERRORS.txt
              fi
            done
          else
            echo "No audio was generated by the upstream free Space; no substitute or paid service was used." > music-production/GENERATION_BLOCKER.txt
          fi
      - name: Require valid audio file and explicit pending-rights status
        if: ${{ steps.generate_music.outcome == 'success' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path("music-production/production_report.json").read_text(encoding="utf-8"))
          assert report.get("status") == "generated_audio_needs_human_review", report.get("status")
          assert report.get("rights_verified") is False
          assert report.get("human_review_required") is True
          assert report.get("editorial_verdict") == "PENDING_HUMAN_LISTENING"
          assert report.get("creative_approval") is False
          assert report.get("eligible_for_video_assembly") is False
          assert report.get("publication_status") == "NOT_PUBLISHED"
          audio = Path(report["file"]).resolve()
          root = Path("music-production/generated").resolve()
          assert audio.is_file() and root in audio.parents and audio.stat().st_size > 100_000
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name:format=duration", "-of", "json", str(audio)],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          assert any(s.get("codec_type") == "audio" for s in data.get("streams", [])), data
          duration = float(data["format"]["duration"])
          assert 220 <= duration <= 260, f"Unexpected duration: {duration}"
          print(f"PASS: generated audio is readable, {duration:.2f}s; rights remain pending.")
          PY
      - name: Verify loudness, silence and SHA; keep editorial review pending
        if: ${{ steps.generate_music.outcome == 'success' }}
        run: |
          python -m scripts.music_audio_qc --report music-production/production_report.json --output music-production/TECHNICAL_AUDIO_QA.json
      - name: Checkout private agent for private Drive persistence
        if: always()
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Install private Drive sync dependencies
        if: always()
        run: python -m pip install -r agent/requirements.txt
      - name: Copy original-music report and audio into private output library
        if: always()
        run: |
          mkdir -p "agent/output/original-music/run-${{ github.run_id }}"
          cp -a music-production/. "agent/output/original-music/run-${{ github.run_id }}/"
      - name: Persist original-music result and diagnostics to private Drive
        if: always()
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-original-music
          python main.py drive-status
      - name: Confirm human-review and publication gates
        if: always()
        run: |
          echo "Generated music remains unapproved until the user listens and approves it."
          echo "No public workflow artifact, YouTube upload, or public publication is created."
