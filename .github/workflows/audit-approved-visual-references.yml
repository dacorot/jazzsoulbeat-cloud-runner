name: Audit approved Jazz Soul Beat visual references
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-approved-visual-references.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-visual-reference-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Drive and image dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow
      - name: Inventory and download candidate visual references read-only
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          mkdir -p visual-reference-audit/assets
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from googleapiclient.http import MediaIoBaseDownload
          import sys
          sys.path.insert(0, "agent")
          from drive_storage import DriveStore

          store = DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"], root=Path("agent"))
          service = store.service
          roots = [
              ("user_shared_reference_folder", "19Ujsr_XC2ZDlDegrmDwKwfczM4wvIHcO"),
              ("user_shared_secondary_folder", "17sZt8cCTGIDOnjuYp9soPqC_rA5apZcV"),
              ("private_agent_storage_root", store.ensure_folder()),
          ]
          q = "name = 'JAZZ SOUL BEAT – BIBLIOTECA DE REFERENCIAS' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
          found = service.files().list(q=q, spaces="drive", pageSize=20,
              fields="files(id,name,mimeType,parents,webViewLink)",
              supportsAllDrives=True, includeItemsFromAllDrives=True, corpora="allDrives").execute().get("files", [])
          roots.extend(("reference_library", f["id"]) for f in found)

          inventory = []
          visited = set()
          queue = [(label, fid, 0) for label, fid in roots]
          while queue and len(visited) < 80:
              label, folder_id, depth = queue.pop(0)
              if folder_id in visited:
                  continue
              visited.add(folder_id)
              try:
                  meta = service.files().get(fileId=folder_id, supportsAllDrives=True,
                      fields="id,name,mimeType,parents,webViewLink").execute()
                  folder_name = meta.get("name", label)
                  token = None
                  while True:
                      page = service.files().list(q=f"'{folder_id}' in parents and trashed = false",
                          spaces="drive", pageSize=100, pageToken=token, orderBy="name",
                          fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,description,originalFilename,parents)",
                          supportsAllDrives=True, includeItemsFromAllDrives=True, corpora="allDrives").execute()
                      for item in page.get("files", []):
                          item["audit_root"] = label
                          item["parent_folder_name"] = folder_name
                          inventory.append(item)
                          if item.get("mimeType") == "application/vnd.google-apps.folder" and depth < 3:
                              queue.append((label, item["id"], depth + 1))
                      token = page.get("nextPageToken")
                      if not token:
                          break
              except Exception as exc:
                  inventory.append({"audit_root": label, "id": folder_id, "error": str(exc)})

          # Also search recent user-uploaded files across Drive, excluding agent-managed assets.
          recent = []
          token = None
          while True:
              page = service.files().list(
                  q="trashed = false and modifiedTime > '2026-11-01T00:00:00'",
                  spaces="drive", pageSize=100, pageToken=token, orderBy="modifiedTime desc",
                  fields="nextPageToken,files(id,name,mimeType,size,modifiedTime,webViewLink,description,originalFilename,parents,appProperties,owners(displayName,emailAddress))",
                  supportsAllDrives=True, includeItemsFromAllDrives=True, corpora="allDrives").execute()
              for item in page.get("files", []):
                  if (item.get("appProperties") or {}).get("agent") == "jazz-soul-beat":
                      continue
                  item["audit_root"] = "recent_user_uploads"
                  item["parent_folder_name"] = "Recent Drive files (read-only search)"
                  recent.append(item)
              token = page.get("nextPageToken")
              if not token:
                  break
          inventory.extend(recent)
          out = Path("visual-reference-audit")
          (out / "inventory.json").write_text(json.dumps(inventory, ensure_ascii=False, indent=2), encoding="utf-8")
          candidates = [x for x in inventory if x.get("mimeType", "").startswith("image/") and x.get("id")]
          downloaded = []
          for index, item in enumerate(candidates[:100], 1):
              size = int(item.get("size") or 0)
              if size > 30 * 1024 * 1024:
                  continue
              suffix = Path(item.get("name", "")).suffix.lower()
              if not suffix or not re.fullmatch(r"\.[a-z0-9]{2,5}", suffix):
                  suffix = ".img"
              name = f"{index:03d}_{re.sub(r'[^A-Za-z0-9._-]+','_',item.get('name','image'))}"
              dest = out / "assets" / (name if Path(name).suffix else name + suffix)
              request = service.files().get_media(fileId=item["id"], supportsAllDrives=True)
              with dest.open("wb") as handle:
                  downloader = MediaIoBaseDownload(handle, request, chunksize=4 * 1024 * 1024)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk(num_retries=3)
              item["downloaded_as"] = str(dest)
              downloaded.append(item)
          (out / "downloaded_images.json").write_text(json.dumps(downloaded, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({"folders_scanned": len(visited), "files_indexed": len(inventory),
              "image_candidates": len(candidates), "images_downloaded": len(downloaded)}, ensure_ascii=False))
          PY
      - name: Build contact sheet for visual review
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json
          root = Path("visual-reference-audit")
          rows = json.loads((root / "downloaded_images.json").read_text(encoding="utf-8"))
          tiles = []
          for row in rows:
              path = Path(row["downloaded_as"])
              try:
                  im = Image.open(path).convert("RGB")
                  im.thumbnail((480, 270))
                  tile = Image.new("RGB", (500, 315), "white")
                  tile.paste(im, ((500-im.width)//2, 8))
                  label = (row.get("name") or path.name)[:65]
                  ImageDraw.Draw(tile).text((10, 285), label, fill="black")
                  tiles.append(tile)
              except Exception as exc:
                  print(f"Skipped {path}: {exc}")
          if tiles:
              cols = 2
              rows_n = (len(tiles)+cols-1)//cols
              sheet = Image.new("RGB", (cols*500, rows_n*315), "#d8d8d8")
              for i, tile in enumerate(tiles):
                  sheet.paste(tile, ((i%cols)*500, (i//cols)*315))
              sheet.save(root / "contact-sheet.jpg", quality=90)
          else:
              (root / "NO_IMAGES_FOUND.txt").write_text("No images were found in the scanned reference folders.")
          PY
      - name: Upload private visual-reference audit
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-approved-visual-reference-audit
          path: visual-reference-audit/
          if-no-files-found: error
          retention-days: 7
