name: Reusable private cloud agent QA runner — full autonomy, KPI and PDCA validation
on:
  workflow_call:
    inputs:
      agent_repository:
        description: "Private agent repository in owner/name form"
        required: true
        type: string
      agent_ref:
        description: "Branch, tag or immutable commit SHA"
        required: true
        type: string
      python_version:
        description: "Python runtime"
        required: false
        default: "3.11"
        type: string
    secrets:
      PRIVATE_REPO_READ_TOKEN:
        required: true
      DRIVE_TOKEN_JSON:
        required: true
permissions:
  contents: read
concurrency:
  group: reusable-private-agent-${{ inputs.agent_repository }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent_repository }}
          ref: ${{ inputs.agent_ref }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Restore governance state from private Drive
        id: restore_state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull-state
      - name: Start PDCA cycle
        id: pdca_start
        working-directory: agent
        run: |
          cycle_json="$(python main.py pdca-start --task cloud-preflight --objective "Validate code, tests, synthetic media and safety boundaries")"
          cycle_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["cycle_id"])' <<< "$cycle_json")"
          echo "cycle_id=$cycle_id" >> "$GITHUB_OUTPUT"
      - name: Compile and test
        id: tests
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build synthetic QA output
        id: selftest
        working-directory: agent
        run: python main.py self-test
      - name: Verify synthetic QA artifacts
        id: artifacts
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          folders = sorted(Path("output").glob("self-test-*"))
          if not folders:
              raise SystemExit("No synthetic QA folder was produced.")
          latest = folders[-1]
          required = ["test-video.mp4", "test-mix.mp3", "test-thumbnail.jpg", "SELF_TEST.txt"]
          missing = [name for name in required if not (latest / name).is_file() or (latest / name).stat().st_size <= 0]
          if missing:
              raise SystemExit("Missing or empty QA artifacts: " + ", ".join(missing))
          print(f"Verified synthetic QA package: {latest}")
          PY
      - name: Record PDCA execution
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        working-directory: agent
        run: |
          python main.py pdca-do --cycle-id "${{ steps.pdca_start.outputs.cycle_id }}" --result-json '{"workflow":"private-agent-qa","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}' --evidence "GitHub Actions run ${{ github.run_id }}"
      - name: Verify PDCA acceptance criteria
        id: pdca_check
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        working-directory: agent
        run: |
          checks='[{"name":"compile_and_unit_tests","passed":${{ steps.tests.outcome == 'success' }}},{"name":"synthetic_render","passed":${{ steps.selftest.outcome == 'success' }}},{"name":"qa_artifacts","passed":${{ steps.artifacts.outcome == 'success' }}},{"name":"no_publication","passed":true}]'
          python main.py pdca-check --cycle-id "${{ steps.pdca_start.outputs.cycle_id }}" --checks-json "$checks"
      - name: Complete PDCA ACT review
        if: ${{ always() && steps.pdca_check.outcome == 'success' }}
        working-directory: agent
        run: |
          python main.py pdca-act --cycle-id "${{ steps.pdca_start.outputs.cycle_id }}" --root-cause "Acceptance criteria passed; no active defect detected" --corrective-action "Retain the validated configuration and use this run as the next comparison baseline" --regression-test "Repeat compile, full unit suite, synthetic render and artifact inspection on the next preflight" --result "All acceptance criteria passed"
      - name: Record corrective follow-up when PDCA checks fail
        if: ${{ always() && steps.pdca_check.outcome == 'failure' }}
        working-directory: agent
        run: |
          python main.py pdca-act --cycle-id "${{ steps.pdca_start.outputs.cycle_id }}" --root-cause "One or more cloud preflight acceptance checks failed; inspect the failed step logs" --corrective-action "Keep the production gates closed, diagnose the first failing check and apply a bounded correction" --regression-test "Repeat compile, full unit suite, synthetic render and artifact inspection" --result "Correction required; next preflight must verify the fix"
      - name: Generate daily KPI report from observed events
        if: ${{ always() && steps.restore_state.outcome == 'success' }}
        working-directory: agent
        run: |
          python main.py performance-report --days 1 --save
          python main.py performance-report --days 7 --save
      - name: Persist QA output and PDCA state to private Drive
        if: ${{ always() && steps.restore_state.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-qa
          python main.py drive-push-state
          python main.py drive-status
      - name: Confirm no public publication
        if: always()
        run: |
          echo "Reusable QA workflow only. No YouTube credentials or upload command are provided."
          echo "The private agent's approved publishing gate remains under that agent's own controller."
