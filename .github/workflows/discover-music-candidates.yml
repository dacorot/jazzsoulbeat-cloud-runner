name: Discover new Jazz Soul Beat music candidates
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 4"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-music-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Discover candidates from Wikimedia Commons
        id: commons
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-commons --limit 100
      - name: Discover candidates from ccMixter
        id: ccmixter
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-ccmixter --limit 100
      - name: Discover candidates from Ketsa official catalogue
        id: ketsa
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-ketsa --limit 100
      - name: Create discovery summary
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          root = Path("output")
          files = sorted(p for p in root.rglob("*.csv") if any(k in p.name.casefold() for k in ("commons", "ccmixter", "ketsa")))
          lines = [
              "# Jazz Soul Beat — music discovery",
              "",
              "Automated candidate discovery only. No audio is approved, no rights flags are changed, and no track enters production automatically.",
              "",
          ]
          for path in files:
              try:
                  with path.open(newline="", encoding="utf-8-sig") as f:
                      count = max(0, sum(1 for _ in csv.DictReader(f)))
              except Exception:
                  count = "unreadable"
              lines.append(f"- {path.as_posix()}: {count} rows")
          if not files:
              lines.append("- No candidate CSVs were produced in this run.")
          lines += [
              "",
              "Every candidate remains pending manual confirmation of uploader authority, composition, performance, master recording, samples, commercial use, synchronization and channel suitability.",
          ]
          (root / "MUSIC_DISCOVERY_SUMMARY.md").write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          print("\\n".join(lines))
          PY
      - name: Persist candidate catalogues and summary to private Drive
        if: always()
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status
      - name: Report discovery safety boundary
        if: always()
        run: |
          echo "Discovery is read-only. No candidate is approved or imported into production."
          echo "No YouTube upload or publication is performed."
