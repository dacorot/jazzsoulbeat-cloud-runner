name: Discover new Jazz Soul Beat music candidates
on:
  push:
    paths:
      - "discovery-once.trigger"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 4"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-music-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Discover candidates from Wikimedia Commons
        id: commons
        timeout-minutes: 8
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-commons --limit 200
      - name: Discover candidates from Internet Archive CC BY and CC0 audio
        id: internet_archive
        timeout-minutes: 20
        continue-on-error: true
        working-directory: agent
        run: |
          python - <<'PY'
          import internet_archive_catalog
          path, rows = internet_archive_catalog.discover(limit=500)
          print(f"Internet Archive candidates with CC BY/CC0 metadata and audio >180s: {len(rows)}")
          print(f"CSV: {path}")
          print("All remain pending; license metadata alone never verifies the rights chain.")
          PY
      - name: Discover candidates from Openverse commercial CC BY and CC0 audio
        id: openverse
        timeout-minutes: 8
        continue-on-error: true
        working-directory: agent
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: python main.py discover-openverse --limit 300
      - name: Discover candidates from official Incompetech catalogue
        id: incompetech
        timeout-minutes: 5
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-incompetech
      - name: Discover candidates from ccMixter
        id: ccmixter
        timeout-minutes: 15
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-ccmixter --limit 200
      - name: Discover candidates from Ketsa official catalogue
        id: ketsa
        timeout-minutes: 20
        continue-on-error: true
        working-directory: agent
        run: python main.py discover-ketsa --limit 100
      - name: Create consolidated review queue and discovery summary
        working-directory: agent
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          root = Path("output")
          source_files = sorted(p for p in root.glob("*_candidates.csv"))
          fields = [
              "source_catalog", "title", "artist", "duration_seconds", "duration_raw", "genre",
              "instruments", "mood", "license_name", "license_url", "source_url",
              "download_url", "screening_status", "rights_status", "rights_verified",
              "permission", "uploader_authority", "composition_rights", "performance_rights",
              "recording_rights", "review_status", "human_decision", "archive_identifier",
              "filename", "format", "size_bytes",
              "provider", "source", "filetype", "openverse_id", "attribution",
          ]
          def first(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ""):
                      return str(value).strip()
              return ""
          def duration_seconds(value):
              text = str(value or "").strip()
              if not text:
                  return None
              try:
                  if ":" in text:
                      total = 0.0
                      for part in text.split(":"):
                          total = total * 60 + float(part)
                      return total
                  return float(text)
              except (TypeError, ValueError):
                  return None
          master = []
          counts = []
          for path in source_files:
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  rows = list(csv.DictReader(handle))
              counts.append((path.name, len(rows)))
              for row in rows:
                  raw_duration = first(row, "duration_seconds", "duration")
                  parsed_duration = duration_seconds(raw_duration)
                  master.append({
                      "source_catalog": path.stem.replace("_candidates", ""),
                      "title": first(row, "title", "title_hint", "file_title"),
                      "artist": first(row, "artist", "artist_hint"),
                      "duration_seconds": f"{parsed_duration:.2f}" if parsed_duration is not None else "",
                      "duration_raw": raw_duration,
                      "genre": first(row, "genre", "genres", "discovery_category", "page_tags"),
                      "instruments": first(row, "instruments"),
                      "mood": first(row, "mood", "feel"),
                      "license_name": first(row, "license_name", "page_license", "license_filter"),
                      "license_url": first(row, "license_url", "license_evidence_url"),
                      "source_url": first(row, "source_url"),
                      "download_url": first(row, "download_url"),
                      "screening_status": first(row, "screening_status"),
                      "rights_status": first(row, "rights_status"),
                      "rights_verified": first(row, "rights_verified"),
                      "permission": first(row, "permission"),
                      "uploader_authority": first(row, "uploader_authority"),
                      "composition_rights": first(row, "composition_rights"),
                      "performance_rights": first(row, "performance_rights"),
                      "recording_rights": first(row, "recording_rights"),
                      "review_status": first(row, "review_status", "screening_notes", "review_notes"),
                      "human_decision": "PENDING — NOT APPROVED",
                      "archive_identifier": first(row, "archive_identifier"),
                      "filename": first(row, "filename"),
                      "format": first(row, "format"),
                      "size_bytes": first(row, "size_bytes"),
                      "provider": first(row, "provider"),
                      "source": first(row, "source"),
                      "filetype": first(row, "filetype"),
                      "openverse_id": first(row, "openverse_id"),
                      "attribution": first(row, "attribution"),
                  })
          with (root / "MUSIC_CANDIDATE_REVIEW.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(master)
          # Build a long-track priority queue without approving any candidate.
          priority_fields = fields + ["previous_user_selection", "selection_order", "triage_priority", "duplicate_title_artist_key"]
          selected_order = {
              "thatsfabulous": 1,
              "neverheard": 2,
              "soulinstrumental2": 3,
              "soulchoir": 4,
              "ownedtheday": 5,
          }
          def title_key(value):
              return "".join(char for char in str(value).casefold() if char.isalnum())
          source_rank = {"incompetech": 1, "ketsa": 2, "commons": 3, "ccmixter": 4, "internet_archive": 5}
          long_tracks = [
              row for row in master
              if row["duration_seconds"]
              and float(row["duration_seconds"]) > 180
              and row["source_url"]
              and row["license_url"]
          ]
          long_tracks.sort(key=lambda row: (
              selected_order.get(title_key(row["title"]), 99),
              source_rank.get(row["source_catalog"].casefold(), 9),
              row["title"].casefold(),
              row["artist"].casefold(),
          ))
          seen_keys = set()
          for row in long_tracks:
              key = (row["title"].strip().casefold(), row["artist"].strip().casefold())
              row["duplicate_title_artist_key"] = "yes" if key in seen_keys else "no"
              seen_keys.add(key)
              order = selected_order.get(title_key(row["title"]))
              row["previous_user_selection"] = "yes" if order is not None else "no"
              row["selection_order"] = str(order or "")
              row["triage_priority"] = {
                  "incompetech": "P1 — official creator catalogue; inspect exact item and attribution",
                  "ketsa": "P1 — official creator catalogue; inspect exact item and attribution",
                  "commons": "P2 — inspect file page, uploader authority and license",
                  "ccmixter": "P2 — inspect sample declarations and uploader grant",
                  "internet_archive": "P3 — inspect uploader authority and full rights chain",
              }.get(row["source_catalog"].casefold(), "P3 — manual source and rights review")
          with (root / "MUSIC_PRIORITY_REVIEW.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.DictWriter(handle, fieldnames=priority_fields)
              writer.writeheader()
              writer.writerows(long_tracks)
          lines = [
              "# Jazz Soul Beat — music discovery",
              "",
              f"Consolidated candidates: {len(master)}",
              f"Sources scanned: {len(counts)}",
              "",
              "Automated candidate discovery only. Every row remains pending; no audio is approved, no rights flags are changed and no track enters production automatically.",
              "",
          ]
          lines.extend(f"- {name}: {count} rows" for name, count in counts)
          valid_durations = [float(row["duration_seconds"]) for row in master if row["duration_seconds"]]
          source_urls = [row["source_url"].strip().casefold() for row in master if row["source_url"]]
          unique_urls = set(source_urls)
          duplicate_urls = len(source_urls) - len(unique_urls)
          unique_track_keys = {
              (row["title"].strip().casefold(), row["artist"].strip().casefold())
              for row in master if row["title"].strip()
          }
          lines += [
              "",
              f"Unique source URLs: {len(unique_urls)}",
              f"Duplicate source URL rows: {duplicate_urls}",
              f"Rows with parseable duration: {len(valid_durations)}",
              f"Rows missing/unparseable duration: {len(master) - len(valid_durations)}",
              f"Rows longer than 180 seconds (metadata only): {sum(value > 180 for value in valid_durations)}",
              f"Priority review rows (>180s, source and license URL present): {len(long_tracks)}",
              f"Previously user-selected Ketsa titles found in priority queue: {sum(row['previous_user_selection'] == 'yes' for row in long_tracks)} of 5",
              f"Repeated title/artist keys within priority review: {sum(row['duplicate_title_artist_key'] == 'yes' for row in long_tracks)}",
              f"Unique title/artist keys: {len(unique_track_keys)}",
              "",
              "Duration and duplicate counts are metadata triage only. They do not verify that a file is a complete music track or that its rights chain is valid.",
              "The master CSV is a review queue, not an approval manifest. Confirm uploader authority, composition, performance, master recording, samples, commercial use, synchronization and channel suitability before any track is approved.",
          ]
          (root / "MUSIC_DISCOVERY_SUMMARY.md").write_text(chr(10).join(lines) + chr(10), encoding="utf-8")
          print(chr(10).join(lines))
          PY
      - name: Persist candidate catalogues and summary to private Drive
        if: always()
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status
      - name: Report discovery safety boundary
        if: always()
        run: |
          echo "Discovery is read-only. No candidate is approved or imported into production."
          echo "No YouTube upload or publication is performed."
      - name: Preserve discovery CSVs as a downloadable audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-music-candidates
          path: |
            agent/output/*_candidates.csv
            agent/output/MUSIC_CANDIDATE_REVIEW.csv
            agent/output/MUSIC_PRIORITY_REVIEW.csv
            agent/output/MUSIC_DISCOVERY_SUMMARY.md
          if-no-files-found: warn
          retention-days: 14
