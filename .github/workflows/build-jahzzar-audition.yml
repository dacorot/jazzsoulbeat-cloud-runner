name: Build private Jahzzar audition pack
# Re-run after adding archive validation for AppleDouble resource forks.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-jahzzar-audition.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jahzzar-private-audition
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
      - name: Checkout private agent branch
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run agent tests, including strict rights gate
        run: python -m pytest -q tests
        working-directory: agent
      - name: Download official Jahzzar albums and build private audition sampler
        run: python agent/jahzzar_review_pack.py
      - name: Push source audio, manifest and review artifacts to private Drive
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from drive_storage import DriveStore
          store = DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"])
          pushed = store.push()
          remote = store._index_remote(store._remote_files())
          wanted = [
              "output/jahzzar-review/JAHZZAR_AUDITION.mp3",
              "output/jahzzar-review/JAHZZAR_REVIEW_INDEX.csv",
              "output/jahzzar-review/JAHZZAR_RIGHTS_EVIDENCE.json",
              "output/jahzzar-review/JAHZZAR_PROVENANCE.json",
              "output/jahzzar-review/JAHZZAR_REVIEW_SUMMARY.md",
              "tracks/review/jahzzar/jahzzar_review_manifest.csv",
          ]
          links = []
          for path in wanted:
              item = remote.get(path)
              if item:
                  links.append({
                      "path": path,
                      "url": f"https://drive.google.com/file/d/{item['id']}/view",
                      "sha256": (item.get("appProperties") or {}).get("sha256"),
                      "bytes": item.get("size"),
                  })
          print(json.dumps({"drive_push": pushed, "private_artifacts": links}, indent=2))
          if len(links) != len(wanted):
              raise SystemExit("One or more expected private Drive artifacts were not confirmed.")
          PY
        working-directory: agent
