name: Audit Open Lo-Fi rights evidence (read only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-openlofi-rights.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-openlofi-rights-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          path: controller
      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore only Open Lo-Fi review files from private Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from drive_storage import DriveStore
          store = DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"])
          result = store.pull(paths=("tracks/review/openlofi/",))
          print(json.dumps(result, ensure_ascii=False))
          PY
          test "$(find tracks/review/openlofi -maxdepth 1 -name '*.mp3' | wc -l)" -eq 40

      - name: Start PDCA cycle for Open Lo-Fi rights audit
        id: pdca_start
        uses: ./controller/.github/actions/pdca-start
        with:
          task: openlofi-rights-audit
          objective: Reassess source and audio provenance while keeping all 40 Open Lo-Fi candidates pending
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
      - name: Run read-only rights and provenance audit
        id: audit
        working-directory: agent
        run: python scripts/audit_openlofi_rights.py
      - name: Persist audit report to private Drive
        id: persist
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status
      - name: Verify review-only guard
        id: guard
        working-directory: agent
        run: |
          test -s output/openlofi-review/OPENLOFI_RIGHTS_AUDIT.csv
          test -s output/openlofi-review/OPENLOFI_RIGHTS_EVIDENCE.json
          test -s output/openlofi-review/OPENLOFI_RIGHTS_REVIEW.txt
          echo "Read-only audit complete. No approval, production import, YouTube upload or publication."
      - name: Verify and close Open Lo-Fi PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./controller/.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"openlofi-rights-audit","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"rights_and_provenance_audit","passed":${{ steps.audit.outcome == 'success' }}},{"name":"review_only_guard","passed":${{ steps.guard.outcome == 'success' }}},{"name":"private_drive_persistence","passed":${{ steps.persist.outcome == 'success' }}},{"name":"no_rights_auto_approval","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; Open Lo-Fi audit CSV and JSON evidence'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
