name: Refresh private Incompetech review library
# Refresh trigger: persist official jazz and holiday candidates and expose a compact, reviewable evidence artifact.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-incompetech-review-library.yml"
  schedule:
    - cron: "30 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-incompetech-review-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent

      - name: Record exact agent revision
        id: agent_revision
        working-directory: agent
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Private agent revision: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PDCA cycle for Incompetech review refresh
        id: pdca_start
        uses: ./controller/.github/actions/pdca-start
        with:
          task: incompetech-review-refresh
          objective: Rebuild official Incompetech candidate, rights-evidence and audition assets without approving any track
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Install test runner
        working-directory: agent
        run: python -m pip install pytest

      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run private agent test suite
        id: tests
        working-directory: agent
        run: python -m pytest -q tests

      - name: Audit official Incompetech catalog and individual track pages
        id: catalog_audit
        timeout-minutes: 15
        working-directory: agent
        run: |
          python main.py discover-incompetech
          python main.py audit-incompetech-sources
          python main.py audit-incompetech-track-pages
          python main.py download-incompetech

      - name: Verify review-only holiday and evergreen candidates
        id: review_gate
        working-directory: agent
        run: |
          test -s output/incompetech_candidates.csv
          test -s tracks/review/incompetech/download_receipt.json
          python -c 'import csv; from pathlib import Path; p=Path("output/incompetech_candidates.csv"); rows=list(csv.DictReader(p.open(newline="", encoding="utf-8-sig"))); holiday=[r for r in rows if "Holiday" in (r.get("genre") or "")]; pending=all("PENDING" in (r.get("review_status") or "").upper() for r in rows); print("Catalog candidates:", len(rows), "holiday candidates:", len(holiday), "all pending:", pending)'

      - name: Audit Incompetech commercial license, catalog identity and audio hashes
        id: rights_audit
        working-directory: agent
        run: python rights_audit.py incompetech

      - name: Build private Incompetech listening sampler
        id: sampler
        working-directory: agent
        run: python incompetech_audition_pack.py

      - name: Persist candidate audio, sampler and source evidence to private Google Drive
        id: persist
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Confirm review-only and publication safety
        id: safety_gate
        working-directory: agent
        run: |
          test -d tracks/review/incompetech
          test -s output/incompetech_candidates.csv
          echo "Review-only candidate staging complete. No YouTube OAuth, upload, public access or publication was attempted."

      - name: Publish compact review evidence as a temporary workflow artifact
        if: ${{ always() && steps.rights_audit.outcome == 'success' && steps.sampler.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-incompetech-evidence
          path: |
            agent/output/incompetech_candidates.csv
            agent/output/incompetech-review/INCOMPETECH_AUDITION.mp3
            agent/output/incompetech-review/INCOMPETECH_AUDITION_SUMMARY.md
            agent/output/incompetech-review/INCOMPETECH_REVIEW_INDEX.csv
            agent/output/incompetech-review/INCOMPETECH_REVIEW_RIGHTS_EVIDENCE.json
            agent/output/incompetech-review/INCOMPETECH_AUDITION_PROVENANCE.json
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_AUDIT.csv
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_EVIDENCE.json
            agent/tracks/review/incompetech/source_audit.csv
            agent/tracks/review/incompetech/track_page_audit.csv
            agent/tracks/review/incompetech/inspection_report.csv
            agent/tracks/review/incompetech/download_receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and close Incompetech PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./controller/.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"incompetech-review-refresh","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"unit_tests","passed":${{ steps.tests.outcome == 'success' }}},{"name":"official_catalog_audit","passed":${{ steps.catalog_audit.outcome == 'success' }}},{"name":"review_only_candidate_gate","passed":${{ steps.review_gate.outcome == 'success' }}},{"name":"rights_evidence_audit","passed":${{ steps.rights_audit.outcome == 'success' }}},{"name":"private_sampler","passed":${{ steps.sampler.outcome == 'success' }}},{"name":"private_drive_persistence","passed":${{ steps.persist.outcome == 'success' }}},{"name":"no_automatic_rights_approval_or_publication","passed":${{ steps.safety_gate.outcome == 'success' }}},{"name":"no_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; Incompetech catalogue, rights audit and private audition package'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
