name: Jazz Soul Beat - first video watchdog

on:
  push:
    paths:
      - ".github/workflows/production-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jazz Soul Beat private cloud agent"
      - "Jazz Soul Beat development agents supervisor"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: jazz-soul-beat-first-video-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Monitor and recover first-video pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch missing private production cycle
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/runs?per_page=10")"
          latest="$(printf '%s' "$runs" | jq -c '[.workflow_runs[]] | sort_by(.created_at) | reverse | .[0] // {}')"
          latest_created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
          latest_status="$(printf '%s' "$latest" | jq -r '.status // "none"')"
          latest_conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
          latest_run_id="$(printf '%s' "$latest" | jq -r '.id // ""')"
          latest_attempt="$(printf '%s' "$latest" | jq -r '.run_attempt // 0')"
          running_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length')"
          now_epoch="$(date +%s)"
          latest_epoch=0
          [[ -n "$latest_created" ]] && latest_epoch="$(date -d "$latest_created" +%s)"
          age_seconds=$((now_epoch - latest_epoch))
          # Recover same-day publication debt after a stale/failed cycle;
          # concurrency still prevents duplicate renders.
          if [[ "$running_count" == "0" && ("$age_seconds" -ge 21600 || (("$latest_conclusion" == "failure" || "$latest_conclusion" == "cancelled") && "$age_seconds" -ge 60 && "$latest_attempt" -lt 3)) ]]; then
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/dispatches" \
              -f ref=main -f 'inputs[task]=build-evergreen' -f 'inputs[hours]=2' \
              -f 'inputs[collection]=evergreen' -f 'inputs[season]=' \
              -f 'inputs[agent_ref]=fix/real-music-and-cinematic-motion'
            echo "Private production cycle dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Private production already running or recent; no duplicate dispatch." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "status=$latest_status"
            echo "conclusion=$latest_conclusion"
            echo "run_id=$latest_run_id"
            echo "attempt=$latest_attempt"
            echo "retryable=$([[ ("$latest_conclusion" == "failure" || "$latest_conclusion" == "cancelled") && "$latest_attempt" -lt 3 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Recover bounded failed run
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && steps.inspect.outputs.retryable == 'true' && fromJSON(steps.inspect.outputs.attempt) < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Bounded recovery requested for failed jobs in run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: Report exhausted failure without mutation
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && fromJSON(steps.inspect.outputs.attempt) >= 3 }}
        run: |
          echo "::error::The production run failed three times; automatic retries are exhausted."
          echo "No publication, deletion or unrestricted code mutation was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          STATUS: ${{ steps.inspect.outputs.status }}
          CONCLUSION: ${{ steps.inspect.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not configured; watchdog report remains in GitHub."
            exit 0
          fi
          text="Jazz Soul Beat watchdog: run $RUN_ID | status=$STATUS | conclusion=$CONCLUSION"
          curl --fail --silent --show-error --max-time 20             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$text"
