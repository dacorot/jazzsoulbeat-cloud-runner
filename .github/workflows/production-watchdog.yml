name: Jazz Soul Beat - first video watchdog

on:
  push:
    paths:
      - ".github/workflows/production-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jazz Soul Beat private cloud agent"
      - "Jazz Soul Beat development agents supervisor"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: jazz-soul-beat-first-video-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Monitor and recover first-video pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest private production run
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/runs?per_page=10")"
          latest="$(printf '%s' "$runs" | jq '[.workflow_runs[]] | sort_by(.created_at) | reverse | .[0]')"
          if [[ "$latest" == "null" ]]; then
            run_id="none"
            status="never_run"
            conclusion=""
            attempt="0"
            title="No private production run exists"
            failed_step=""
          else
            run_id="$(printf '%s' "$latest" | jq -r '.id')"
            status="$(printf '%s' "$latest" | jq -r '.status')"
            conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
            attempt="$(printf '%s' "$latest" | jq -r '.run_attempt')"
            title="$(printf '%s' "$latest" | jq -r '.display_title')"
            jobs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/runs/$run_id/jobs?filter=latest")"
            failed_step="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | first // ""')"
          fi
          retryable=true
          case "$failed_step" in
            "Build an evergreen or seasonal video (never uploads)"*|"Capture and validate the exact production render folder"*|"Verify and close requested-task PDCA cycle"*)
              retryable=false
              ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "retryable=$retryable" >> "$GITHUB_OUTPUT"
          echo "failed_step=$failed_step" >> "$GITHUB_OUTPUT"
          latest_created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
          now_epoch="$(date +%s)"
          if [[ -n "$latest_created" ]]; then
            latest_epoch="$(date -d "$latest_created" +%s)"
            age_seconds=$((now_epoch - latest_epoch))
          else
            age_seconds=999999999
          fi
          running_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" || .status == "queued")] | length')"
          dispatch_needed=false
          if [[ "$running_count" == "0" && "$age_seconds" -ge 86400 ]]; then
            dispatch_needed=true
          fi
          echo "dispatch_needed=$dispatch_needed" >> "$GITHUB_OUTPUT"
          {
            echo "## First-video watchdog"
            echo
            echo "- Run: `$run_id`"
            echo "- Status: `$status`"
            echo "- Conclusion: `$conclusion`"
            echo "- Attempt: `$attempt`"
            echo "- Failed step: $failed_step"
            echo "- Retryable: `$retryable`"
            echo "- Title: $title"
            echo "- Production dispatch needed: $dispatch_needed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch missing private production cycle
        if: ${{ steps.inspect.outputs.dispatch_needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/dispatches" \
            -f ref=main \
            -f 'inputs[task]=build-evergreen' \
            -f 'inputs[hours]=2' \
            -f 'inputs[collection]=evergreen' \
            -f 'inputs[season]=' \
            -f 'inputs[agent_ref]=fix/real-music-and-cinematic-motion'
          echo "Dispatched a missing private production cycle." >> "$GITHUB_STEP_SUMMARY"

      - name: Recover bounded failed run
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && steps.inspect.outputs.retryable == 'true' && fromJSON(steps.inspect.outputs.attempt) < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Bounded recovery requested for failed jobs in run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: Report exhausted failure without mutation
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && fromJSON(steps.inspect.outputs.attempt) >= 3 }}
        run: |
          echo "::error::The production run failed three times; automatic retries are exhausted."
          echo "No publication, deletion or unrestricted code mutation was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          STATUS: ${{ steps.inspect.outputs.status }}
          CONCLUSION: ${{ steps.inspect.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not configured; watchdog report remains in GitHub."
            exit 0
          fi
          text="Jazz Soul Beat watchdog: run $RUN_ID | status=$STATUS | conclusion=$CONCLUSION"
          curl --fail --silent --show-error --max-time 20             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$text"
