name: Jazz Soul Beat - first video watchdog
# Release-gate correction: fresh dispatch with complete YouTube credits.

on:
  push:
    paths:
      - ".github/workflows/production-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jazz Soul Beat private cloud agent"
      - "Jazz Soul Beat development agents supervisor"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: jazz-soul-beat-first-video-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Monitor and recover first-video pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch missing private production cycle
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/runs?per_page=10")"
          latest="$(printf '%s' "$runs" | jq -c '[.workflow_runs[]] | sort_by(.created_at) | reverse | .[0] // {}')"
          latest_created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
          latest_status="$(printf '%s' "$latest" | jq -r '.status // "none"')"
          latest_conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
          latest_run_id="$(printf '%s' "$latest" | jq -r '.id // ""')"
          latest_attempt="$(printf '%s' "$latest" | jq -r '.run_attempt // 0')"
          # A failed YouTube upload must not cause the watchdog to rebuild a
          # video that already passed render, capture and private Drive
          # persistence. Retry only failures that happened before a validated
          # production package existed.
          validated_package="false"
          if [[ -n "$latest_run_id" && "$latest_status" == "completed" ]]; then
            jobs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/runs/${latest_run_id}/jobs?per_page=100")"
            build_conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Build an evergreen or seasonal video") | .conclusion] | first // ""')"
            capture_conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Capture and validate the exact production render folder") | .conclusion] | first // ""')"
            persist_conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Persist only the validated production folder and production database") | .conclusion] | first // ""')"
            if [[ "$build_conclusion" == "success" && "$capture_conclusion" == "success" && "$persist_conclusion" == "success" ]]; then
              validated_package="true"
            fi
          fi
          # GitHub can hold a dispatch in `pending` while the concurrency
          # group is occupied. Count it as active or the watchdog will launch
          # a duplicate production run.
          running_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | length')"
          force_dispatch="false"
          if [[ "${{ github.event_name }}" == "push" && "$HEAD_COMMIT_MESSAGE" == *"[dispatch-private-production]"* ]]; then
            force_dispatch="true"
          fi
          now_epoch="$(date +%s)"
          latest_epoch=0
          [[ -n "$latest_created" ]] && latest_epoch="$(date -d "$latest_created" +%s)"
          age_seconds=$((now_epoch - latest_epoch))
          # Recover only from an explicitly forced dispatch or a completed,
          # stale cycle. A recent queued/pending/in-progress run is never
          # replaced, even if the Actions API reports its state inconsistently.
          latest_completed="false"
          [[ "$latest_status" == "completed" ]] && latest_completed="true"
          # The production cadence is every 48 hours; recovery must not turn
          # a missed schedule into an unintended six-hour publishing cadence.
          if [[ "$force_dispatch" == "true" || ("$latest_completed" == "true" && "$age_seconds" -ge 172800) || ("$latest_completed" == "true" && "$latest_conclusion" == "failure" && "$validated_package" != "true" && "$age_seconds" -ge 60 && "$latest_attempt" -lt 3) ]]; then
            jq -n \
              --arg ref main \
              --arg task build-evergreen \
              --arg hours 2 \
              --arg collection evergreen \
              --arg season '' \
              --arg agent_ref fix/real-music-and-cinematic-motion \
              '{ref:$ref,inputs:{task:$task,hours:$hours,collection:$collection,season:$season,agent_ref:$agent_ref}}' \
              > /tmp/private-production-dispatch.json
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/private-cloud-agent.yml/dispatches" \
              --input /tmp/private-production-dispatch.json
            echo "Private production cycle dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Private production already running or recent; no duplicate dispatch." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "status=$latest_status"
            echo "conclusion=$latest_conclusion"
            echo "run_id=$latest_run_id"
            echo "attempt=$latest_attempt"
            echo "retryable=$([[ "$latest_conclusion" == "failure" && "$latest_attempt" -lt 3 ]] && echo true || echo false)"
            echo "validated_package=$validated_package"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch due private music cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/workflows/original-music-library-batch.yml/runs?per_page=10")"
          latest="$(printf '%s' "$runs" | jq -c '[.workflow_runs[]] | sort_by(.created_at) | reverse | .[0] // {}')"
          latest_status="$(printf '%s' "$latest" | jq -r '.status // "none"')"
          latest_created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
          running_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | length')"
          now_epoch="$(date +%s)"
          latest_epoch=0
          [[ -n "$latest_created" ]] && latest_epoch="$(date -d "$latest_created" +%s)"
          age_seconds=$((now_epoch - latest_epoch))
          if [[ "$running_count" -gt 0 ]]; then
            echo "Music production already has an active or queued cycle."
          elif [[ "$latest_status" != "none" && "$age_seconds" -lt 3600 ]]; then
            echo "Music production cycle is recent (${age_seconds}s old); no duplicate dispatch."
          else
            jq -n \
              --arg ref main \
              --arg batch_size 6 \
              --arg target_per_genre 100 \
              '{ref:$ref,inputs:{batch_size:$batch_size,target_per_genre:$target_per_genre}}' \
              > /tmp/music-production-dispatch.json
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/original-music-library-batch.yml/dispatches" \
              --input /tmp/music-production-dispatch.json
            echo "Due private music production cycle dispatched." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch due private visual cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/workflows/visual-production-batch.yml/runs?per_page=10")"
          latest="$(printf '%s' "$runs" | jq -c '[.workflow_runs[]] | sort_by(.created_at) | reverse | .[0] // {}')"
          latest_status="$(printf '%s' "$latest" | jq -r '.status // "none"')"
          latest_created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
          latest_conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
          running_count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | length')"
          now_epoch="$(date +%s)"
          latest_epoch=0
          [[ -n "$latest_created" ]] && latest_epoch="$(date -d "$latest_created" +%s)"
          age_seconds=$((now_epoch - latest_epoch))
          if [[ "$running_count" -gt 0 ]]; then
            echo "Visual production already has an active or queued cycle."
          elif [[ "$latest_status" == "completed" && "$latest_conclusion" == "failure" && "$age_seconds" -lt 3600 ]]; then
            echo "Visual production failed recently (${age_seconds}s old); retry cooling period is active."
          elif [[ "$latest_status" != "none" && "$age_seconds" -lt 86400 ]]; then
            echo "Visual production cycle is recent (${age_seconds}s old); no duplicate dispatch."
          else
            jq -n \
              --arg ref main \
              --arg category midnight_jazz_soul \
              --arg count 8 \
              '{ref:$ref,inputs:{category:$category,count:$count}}' \
              > /tmp/visual-production-dispatch.json
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/visual-production-batch.yml/dispatches" \
              --input /tmp/visual-production-dispatch.json
            echo "Due private visual production cycle dispatched." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recover bounded failed run
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && steps.inspect.outputs.retryable == 'true' && steps.inspect.outputs.validated_package != 'true' && fromJSON(steps.inspect.outputs.attempt) < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Bounded recovery requested for failed jobs in run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: Report exhausted failure without mutation
        if: ${{ steps.inspect.outputs.status == 'completed' && steps.inspect.outputs.conclusion == 'failure' && fromJSON(steps.inspect.outputs.attempt) >= 3 }}
        run: |
          echo "::error::The production run failed three times; automatic retries are exhausted."
          echo "No publication, deletion or unrestricted code mutation was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          STATUS: ${{ steps.inspect.outputs.status }}
          CONCLUSION: ${{ steps.inspect.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not configured; watchdog report remains in GitHub."
            exit 0
          fi
          text="Jazz Soul Beat watchdog: run $RUN_ID | status=$STATUS | conclusion=$CONCLUSION"
          curl --fail --silent --show-error --max-time 20             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$text"
