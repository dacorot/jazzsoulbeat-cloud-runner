name: Jazz Soul Beat - Original Music Library Batch
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum candidates in this cycle"
        required: false
        default: "6"
      target_per_genre:
        description: "Target candidates for each soft genre"
        required: false
        default: "100"
  schedule:
    # Continuous bounded production: re-enter every hour until the
    # persistent queue reaches the target for every genre. The queue state,
    # provider quota handling and concurrency lock keep this from duplicating
    # work or running over an active batch.
    - cron: "0 * * * *"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-music-production
  cancel-in-progress: false
jobs:
  produce-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Gradio client
        run: python -m pip install --upgrade gradio_client
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Install private Drive sync dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Restore private music queue state
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          # The queue state is authoritative; never generate from a partially
          # restored queue. Bound the network operation so a transient Drive
          # issue fails closed and the next scheduled cycle can retry.
          timeout --signal=TERM --kill-after=20s 600s python agent/main.py drive-pull-original-music
          mkdir -p music-production
          prior="$(find agent/output/original-music -name music-batch-state.json -type f | sort | tail -1 || true)"
          if [ -n "$prior" ]; then cp "$prior" music-production/music-batch-state.json; fi
      - name: Generate bounded improvement candidates
        env:
          MUSIC_BATCH_SIZE: ${{ inputs.batch_size || '6' }}
          MUSIC_TARGET_PER_GENRE: ${{ inputs.target_per_genre || '100' }}
          MUSIC_DURATION_SECONDS: "240"
          ACE_STEP_SPACE: "Blursed/Ace-Step-v1.5"
          ACE_STEP_MODEL: "acestep-v15-turbo"
          MUSIC_MAX_WAIT_SECONDS: "900"
        run: timeout --signal=TERM --kill-after=15s 105m python scripts/run_original_music_batch.py
      - name: Upload private batch audition
        uses: actions/upload-artifact@v4
        with:
          name: original-music-batch-${{ github.run_id }}
          path: music-production/batch
          if-no-files-found: warn
          retention-days: 14
      - name: Stage batch for private Drive
        run: |
          mkdir -p "agent/output/original-music/batch-${{ github.run_id }}"
          cp -a music-production/batch/. "agent/output/original-music/batch-${{ github.run_id }}/" || true
          cp music-production/music-batch-state.json agent/output/original-music/music-batch-state.json
          cp -a music-production/PRODUCER_RUN_DIAGNOSTICS.json agent/output/original-music/ 2>/dev/null || true
      - name: Persist batch privately
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-original-music
          python main.py drive-status
      - name: Confirm gates
        run: |
          echo "Candidates remain private and PENDING_HUMAN_LISTENING."
          echo "No track is approved, video-ready, monetized or published automatically."
