name: Jazz Soul Beat private cloud agent

on:
  push:
    paths:
      - "PRIVATE_CLOUD_AGENT_START.md"
  schedule:
    # Three private production drafts weekly: Monday, Wednesday and Friday at 06:00 Colombia (UTC-5).
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        type: choice
        options:
          - self-test
          - build-evergreen
      hours:
        description: "Duración del video evergreen aprobado (horas)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      collection:
        description: "Colección musical"
        required: true
        default: evergreen
        type: choice
        options:
          - evergreen
          - seasonal
      season:
        description: "Slug de temporada (solo seasonal; por ejemplo halloween)"
        required: false
        type: string
      agent_ref:
        description: "Rama o SHA del agente privado que se validará"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-agent:
    name: Restore, run safely, and persist privately
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'build-evergreen' }}
      HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours || '2' }}
      COLLECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.collection || 'evergreen' }}
      SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
      AGENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref || 'fix/real-music-and-cinematic-motion' }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Validate private agent ref
        env:
          AGENT_REF: ${{ env.AGENT_REF }}
        run: |
          if [[ -z "$AGENT_REF" || ! "$AGENT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ || "$AGENT_REF" == *..* || "$AGENT_REF" == */ || "$AGENT_REF" == *//* ]]; then
            echo "Rama o SHA del agente no válida."
            exit 1
          fi

      - name: Check out private agent (read-only token)
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # Repair chain: runner image -> apt package -> pinned static downloader.
          # Each fallback is bounded and diagnostic; a failed attempt must not stop
          # the next repair path.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg already available on the runner."
          else
            echo "FFmpeg missing; attempting the controlled Ubuntu package repair."
            set +e
            if command -v sudo >/dev/null 2>&1; then
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y --no-install-recommends ffmpeg
            else
              echo "sudo is unavailable; skipping apt repair."
            fi
            set -e
          fi

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "Apt repair did not provide FFmpeg; attempting the pinned static repair."
            timeout 180s python -m pip install --disable-pip-version-check ffmpeg-downloader==0.5.3
            timeout 180s python -m ffmpeg_downloader install @gpl
            FFMPEG_BIN_DIR="$(python -c 'import ffmpeg_downloader as f; from pathlib import Path; p=Path(f.ffmpeg_path); q=Path(f.ffprobe_path); assert p.is_file(), p; assert q.is_file(), q; print(p.parent)')"
            echo "$FFMPEG_BIN_DIR" >> "$GITHUB_PATH"
            export PATH="$FFMPEG_BIN_DIR:$PATH"
          fi

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "::error::FFmpeg repair exhausted all paths."
            uname -a || true
            python --version || true
            python -m pip --version || true
            command -v ffmpeg || true
            command -v ffprobe || true
            ls -l /usr/bin/ffmpeg /usr/bin/ffprobe 2>/dev/null || true
            exit 1
          fi

          echo "FFmpeg repair verified:"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test private agent
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Preflight all cloud dependencies before touching production data
        id: preflight
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "$DRIVE_TOKEN_JSON" || { echo "::error::DRIVE_TOKEN_JSON is missing before production."; exit 1; }
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg unavailable in preflight."; exit 1; }
          command -v ffprobe >/dev/null || { echo "::error::ffprobe unavailable in preflight."; exit 1; }
          test -r requirements.txt || { echo "::error::Agent requirements are unavailable."; exit 1; }
          echo "Preflight: secrets, FFmpeg and agent files are present."
          python main.py drive-status >/tmp/jsb-drive-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/jsb-drive-preflight.json').read_text(encoding='utf-8'))
          if not isinstance(report, dict):
              raise SystemExit('Drive preflight returned no structured status.')
          print('Preflight: Drive connection and status query succeeded.')
          PY
      - name: Restore only the data needed for this cloud task
        id: restore
        if: ${{ steps.preflight.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          if [[ "${{ env.TASK }}" == "build-evergreen" ]]; then
            timeout 600s python main.py drive-pull-music-library
            python main.py migrate-manifests
          else
            python main.py drive-pull-state
          fi
          python main.py drive-status

      - name: Validate approved music library without synthetic generation
        id: validate_approved_library
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          python main.py scan
          python main.py library-status
          echo "Synthetic procedural generation is disabled; only approved external/original masters are eligible."

      - name: Show approved library status
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: python main.py library-status

      - name: Snapshot music library before growth
        id: growth_before
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          mkdir -p output/library-promotion
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("tracks")
          files = sorted(
              str(p.relative_to(root))
              for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in {".mp3",".wav",".flac",".m4a",".ogg"}
          )
          Path("output/library-promotion/growth-before.json").write_text(
              json.dumps({"audio_files": files}, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Growth baseline: {len(files)} audio files.")
          PY

      - name: Discover Incompetech catalog
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 5
        run: timeout 300s python main.py discover-incompetech

      - name: Audit Incompetech source evidence
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 5
        run: timeout 300s python main.py audit-incompetech-sources

      - name: Audit Incompetech track pages
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 5
        run: timeout 300s python main.py audit-incompetech-track-pages

      - name: Discover Ketsa catalog
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 8
        run: timeout 300s python main.py discover-ketsa --limit 40

      - name: Download Ketsa review candidates
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 25
        run: timeout 1500s python main.py download-ketsa --limit 40

      - name: Intake library growth candidates
        id: intake_growth
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 5
        run: timeout 300s python main.py intake-library-growth

      - name: Persist growth research
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        timeout-minutes: 10
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: timeout 600s python main.py drive-push-growth-research

      - name: Complete external music growth
        id: external_music_growth
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        run: echo "External music growth completed with individually bounded stages."
      - name: Enforce music growth throughput
        id: growth_gate
        if: ${{ steps.external_music_growth.outcome == 'success' }}
        working-directory: agent
        env:
          REQUIRED_NEW_TRACKS: "20"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          before = set(json.loads(Path("output/library-promotion/growth-before.json").read_text(encoding="utf-8"))["audio_files"])
          root = Path("tracks")
          after = {
              str(p.relative_to(root))
              for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in {".mp3",".wav",".flac",".m4a",".ogg"}
          }
          new_files = sorted(after - before)
          required = int(os.environ["REQUIRED_NEW_TRACKS"])
          report = {
              "baseline_audio_files": len(before),
              "current_audio_files": len(after),
              "new_audio_files": len(new_files),
              "required_new_audio_files": required,
              "new_files": new_files,
              "status": "PASS" if len(new_files) >= required else "FAIL",
          }
          Path("output/library-promotion/growth-throughput.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          if len(new_files) < required:
              raise SystemExit(
                  f"Growth gate failed: {len(new_files)} new audio files; "
                  f"required minimum is {required}."
              )
          PY
      - name: Restore autonomous library-growth batch for promotion
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [[ -s output/library-promotion/eligible-external.json ]]; then
            echo "Growth artifacts already exist in this run; skipping redundant Drive restore."
          else
            timeout 600s python main.py drive-pull-growth-batch
          fi

      - name: Restore approved original-music package for promotion
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [[ -d output/original-music/approved-stable-audio3-20261116 ]]; then
            echo "Approved original-music package already present; skipping Drive restore."
          else
            echo "No approved original-music package present; external licensed intake remains the active source."
          fi

      - name: Prepare hash-bound candidates from approved original music
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          mkdir -p output/library-promotion
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/original-music/approved-stable-audio3-20261116")
          index_path = root / "AUDITION_INDEX.json"
          rights_path = root / "STABLE_AUDIO3_RIGHTS_REVIEW.json"
          candidates = []
          external_path = Path("output/library-promotion/eligible-external.json")
          if external_path.is_file():
              external = json.loads(external_path.read_text(encoding="utf-8"))
              if isinstance(external, list):
                  candidates.extend(external)
                  print(f"Loaded {len(external)} autonomous external candidates.")
          if index_path.is_file() and rights_path.is_file():
              index = json.loads(index_path.read_text(encoding="utf-8"))
              rights = json.loads(rights_path.read_text(encoding="utf-8"))
              evidence_url = "https://stability.ai/community-license-agreement"
              source_url = "https://huggingface.co/stabilityai/stable-audio-3-medium"
              for item in index.get("candidates", []):
                  if item.get("creative_approval") is not True or item.get("rights_verified") is not True:
                      continue
                  artifact = Path(item["file"])
                  if not artifact.is_file():
                      continue
                  candidates.append({
                      "decision": "ELIGIBLE_FOR_LIBRARY",
                      "rights_verified": True,
                      "eligible_for_video_assembly": True,
                      "title": item["title"],
                      "artist": "Stable Audio 3 / Stability AI",
                      "artifact": str(artifact),
                      "artifact_sha256": item["sha256"],
                      "duration_seconds": item["duration_seconds"],
                      "license_name": "Stability AI Community License",
                      "license_url": evidence_url,
                      "source_url": source_url,
                      "attribution": "Generated with Stable Audio 3 by Stability AI; used under the Stability AI Community License.",
                      "rights_evidence_url": evidence_url,
                      "permission": "yes",
                      "license_verified": "yes",
                      "uploader_authority": "yes",
                      "composition_rights": "yes",
                      "performance_rights": "yes",
                      "recording_rights": "yes",
                      "reviewed_at": rights.get("reviewed_at_utc", "2026-11-14"),
                      "review_notes": "Exact mastered hash reviewed under the current Stability AI Community License. Commercial registration, revenue threshold, AUP compliance and residual similarity risk remain applicable.",
                  })
          Path("output/library-promotion/eligible.json").write_text(json.dumps(candidates, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared {len(candidates)} hash-bound original candidates.")
          PY
      - name: Integrate approved original masters
        id: original_promotion
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          python main.py prepare-original-promotion
          python main.py reconcile-music

      - name: Import rights-eligible library candidates
        id: library_promotion
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          candidates="output/library-promotion/eligible.json"
          report="output/library-promotion/import-report.json"
          mkdir -p "$(dirname "$report")"
          if [[ -s "$candidates" ]]; then
            python main.py promote-library --candidates "$candidates" --report "$report"
            python main.py library-status
          else
            printf '{"approved": [], "rejected": [], "approved_seconds": 0, "publication": "DISABLED", "status": "NO_ELIGIBLE_BATCH"}\n' > "$report"
            echo "No hay lote elegible de derechos; el proceso continúa buscando fuentes."
          fi

      - name: Initialize or resume the sequential orchestrator checkpoint
        id: orchestrator_checkpoint
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORCHESTRATOR_VIDEO_ID: video-02
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.orchestrator_agent import new_checkpoint, save_checkpoint
          video_id = os.environ.get("ORCHESTRATOR_VIDEO_ID") or "video-02"
          path = Path("output/orchestrator") / f"{video_id}.checkpoint.json"
          if path.exists():
              checkpoint = json.loads(path.read_text(encoding="utf-8"))
              print(f"Resumed orchestrator: {video_id} at {checkpoint.get('stage')}")
          else:
              checkpoint = new_checkpoint(video_id)
              save_checkpoint(path, checkpoint)
              print(f"Initialized orchestrator: {video_id} at {checkpoint['stage']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stage={checkpoint.get('stage')}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Orchestrator checkpoint\n\nVideo: `{video_id}`\nStage: `{checkpoint.get('stage')}`\n")
          PY

      - name: Check whether the approved library can satisfy the requested video
        id: production_gate
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
        run: |
          python - <<'PY'
          import os
          from curator import pick

          hours = float(os.environ["HOURS"])
          collection = os.environ["COLLECTION"]
          season = os.environ.get("SEASON") or None
          try:
              tracks, source_seconds = pick(hours * 3600, collection=collection, season=season)
          except SystemExit as exc:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("eligible=false\n")
              reason = str(exc)
              print("SKIPPED safely: " + reason)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Production gate\n\n**SKIPPED — no video was rendered.**\n\n" + reason + "\n")
              raise SystemExit(0)
          message = f"ELIGIBLE: {len(tracks)} approved tracks; {source_seconds/3600:.2f} source hours for a {hours:.2f}-hour render."
          print(message)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("eligible=true\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Production gate\n\n**ELIGIBLE** — " + message + "\n")

      - name: Start Deming PDCA cycle for requested cloud task
        id: pdca_start
        if: ${{ steps.restore.outcome == 'success' && (env.TASK == 'self-test' || steps.production_gate.outputs.eligible == 'true') }}
        uses: ./.github/actions/pdca-start
        with:
          task: ${{ env.TASK }}
          objective: Execute the explicitly requested cloud task, verify its outputs and preserve all publication and rights gates
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Build synthetic technical test (never uploads)
        id: self_test
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        run: python main.py self-test

      - name: Build an evergreen or seasonal video (never uploads)
        id: build_video
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' && steps.production_gate.outputs.eligible == 'true' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$COLLECTION" == "evergreen" ]]; then
            SCENE_MANIFEST="assets/visual-agents/midnight_jazz_soul/scenes/SCENE_MANIFEST.json"
            if ! python -c 'import json,sys; from pathlib import Path; from video import _validated_scene_selection; p=Path(sys.argv[1]); m=json.loads(p.read_text(encoding="utf-8")); assert m.get("status") in {"SCENE_SET_GENERATED_PENDING_HUMAN_QA","SCENE_SET_COMPLETE_WITH_DERIVED_VARIANTS_PENDING_HUMAN_QA"}; _validated_scene_selection(p,m,minimum_scenes=8)' "$SCENE_MANIFEST"; then
              echo "No hay una biblioteca visual completa; se intentará generarla solo con cuotas gratuitas."
              python scene_factory.py
            fi
            export JSB_REQUIRE_MULTI_SCENE=1
          fi
          args=(make --hours "$MIX_HOURS" --auto --collection "$COLLECTION")
          if [[ "$COLLECTION" == "seasonal" ]]; then
            if [[ ! "$SEASON" =~ ^[a-z0-9][a-z0-9_-]{0,39}$ ]]; then
              echo "Temporada inválida o ausente; no se construirá ningún video."
              exit 1
            fi
            args+=(--season "$SEASON")
          elif [[ -n "$SEASON" ]]; then
            echo "No se permite indicar temporada para evergreen."
            exit 1
          fi
          python main.py "${args[@]}"

      - name: Capture and validate the exact production render folder
        id: capture_render
        if: ${{ steps.build_video.outcome == 'success' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          JSB_REQUIRE_MULTI_SCENE: ${{ env.COLLECTION == 'evergreen' && '1' || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          root = Path("output")
          candidates = []
          for folder in root.iterdir():
              if not folder.is_dir() or not folder.name.startswith("20"):
                  continue
              required = ["mix.mp3", "video.mp4", "thumb.jpg", "description.txt", "MUSIC_SOURCE.txt"]
              if all((folder / name).is_file() and (folder / name).stat().st_size > 0 for name in required):
                  candidates.append(folder)
          if not candidates:
              raise SystemExit("No se encontró una carpeta de render completa; no se sincronizará nada.")
          folder = max(candidates, key=lambda p: p.stat().st_mtime_ns)
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name,width,height,channels:format=duration", "-of", "json", str(folder / "video.mp4")],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          video = next((s for s in data.get("streams", []) if s.get("codec_type") == "video"), None)
          audio = next((s for s in data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert video and video.get("codec_name") == "h264", video
          assert (video.get("width"), video.get("height")) == (2560, 1440), video
          assert audio and audio.get("codec_name") == "aac" and audio.get("channels") == 2, audio
          duration = float(data["format"]["duration"])
          expected = float(os.environ["HOURS"]) * 3600
          assert abs(duration - expected) <= 3.0, (duration, expected)
          mix_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name:format=duration", "-of", "json", str(folder / "mix.mp3")],
              check=True, capture_output=True, text=True
          )
          mix_data = json.loads(mix_probe.stdout)
          mix_audio = next((s for s in mix_data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert mix_audio and mix_audio.get("codec_name") == "mp3", mix_data
          mix_duration = float(mix_data["format"]["duration"])
          assert abs(mix_duration - expected) <= 3.0, (mix_duration, expected)
          thumb_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=width,height", "-of", "json", str(folder / "thumb.jpg")],
              check=True, capture_output=True, text=True
          )
          thumb_data = json.loads(thumb_probe.stdout)
          thumb_stream = thumb_data.get("streams", [{}])[0]
          assert (thumb_stream.get("width"), thumb_stream.get("height")) == (1280, 720), thumb_data
          source_text = (folder / "MUSIC_SOURCE.txt").read_text(encoding="utf-8")
          source_entries = [line for line in source_text.splitlines() if line[:1].isdigit() and ". " in line[:6]]
          assert source_entries, "MUSIC_SOURCE.txt contains no individual track entries."
          if os.environ.get("COLLECTION") == "evergreen" and os.environ.get("JSB_REQUIRE_MULTI_SCENE") == "1":
              provenance = folder / "VISUAL_SCENE_PROVENANCE.json"
              assert provenance.is_file(), "Falta procedencia de escenas."
              visual = json.loads(provenance.read_text(encoding="utf-8"))
              assert visual.get("scene_count", 0) >= 8
              expected_hash = hashlib.sha256((folder / "video.mp4").read_bytes()).hexdigest()
              assert visual.get("video_sha256") == expected_hash, "El hash de video no coincide con su procedencia."
          print(f"PASS: {folder} | {duration:.2f}s | H.264 QHD | AAC estéreo")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_dir={folder.as_posix()}\n")
          PY

      - name: Write hash-bound production artifact manifest
        if: ${{ steps.capture_render.outcome == 'success' }}
        working-directory: agent
        run: |
          python ../scripts/artifact_manifest_agent.py \
            --run-dir "${{ steps.capture_render.outputs.run_dir }}" \
            --output "${{ steps.capture_render.outputs.run_dir }}/ARTIFACT_MANIFEST.json"
          test -s "${{ steps.capture_render.outputs.run_dir }}/ARTIFACT_MANIFEST.json"
      - name: Persist generated visual scene library privately
        id: persist_visual_assets
        if: ${{ always() && steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' && steps.build_video.outcome != 'skipped' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 600s python main.py drive-push-visual-assets
          python main.py drive-status

      - name: Persist only the validated production folder and production database
        id: persist_outputs
        if: ${{ always() && steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success' && steps.capture_render.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          JSB_PRODUCTION_RUN_DIR: ${{ steps.capture_render.outputs.run_dir }}
        run: |
          set -euo pipefail
          timeout 600s python main.py drive-push-production
          python main.py drive-status

      - name: Persist synthetic QA and autonomy state only
        id: persist_qa
        if: ${{ always() && steps.restore.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 600s python main.py drive-push-qa
          timeout 600s python main.py drive-push-state

      - name: Verify and close requested-task PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"private-cloud-agent","task":"${{ env.TASK }}","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"restore_state","passed":${{ steps.restore.outcome == 'success' }}},{"name":"requested_task","passed":${{ (env.TASK == 'self-test' && steps.self_test.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success') }}},{"name":"private_drive_persistence","passed":${{ (env.TASK == 'self-test' && steps.persist_qa.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.persist_outputs.outcome == 'success') }}},{"name":"visual_library_persistence","passed":${{ env.TASK == 'self-test' || steps.persist_visual_assets.outcome == 'success' }}},{"name":"no_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; requested task outputs and private Drive inventory'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Confirm final Drive inventory
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-status

      - name: State safety boundaries
        if: always()
        run: |
          echo "No se configuró ni ejecutó ninguna subida a YouTube."
          echo "El workflow no contiene YOUTUBE_TOKEN_JSON ni la opción --upload."
          echo "Los archivos persistentes se guardan únicamente en Google Drive privado."
