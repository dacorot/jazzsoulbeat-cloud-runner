name: Jazz Soul Beat private cloud agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        type: choice
        options:
          - self-test
          - build-evergreen
          - build-original
      hours:
        description: "Duración del video (horas, para build-evergreen o build-original)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      collection:
        description: "Colección musical"
        required: true
        default: evergreen
        type: choice
        options:
          - evergreen
          - seasonal
      season:
        description: "Slug de temporada (solo seasonal; por ejemplo halloween)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-private-cloud-agent
  cancel-in-progress: false

jobs:
  run-agent:
    name: Restore, run safely, and persist privately
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Check out private agent (read-only token)
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: master
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test private agent
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Restore private state from Google Drive
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull
          python main.py drive-status

      - name: Show approved library status
        if: ${{ steps.restore.outcome == 'success' }}
        working-directory: agent
        run: python main.py library-status

      - name: Build synthetic technical test (never uploads)
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'self-test' }}
        working-directory: agent
        run: python main.py self-test

      - name: Build an evergreen or seasonal video (never uploads)
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'build-evergreen' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ inputs.hours }}
          COLLECTION: ${{ inputs.collection }}
          SEASON: ${{ inputs.season }}
        run: |
          args=(make --hours "$MIX_HOURS" --auto --collection "$COLLECTION")
          if [[ "$COLLECTION" == "seasonal" ]]; then
            if [[ ! "$SEASON" =~ ^[a-z0-9][a-z0-9_-]{0,39}$ ]]; then
              echo "Temporada inválida o ausente; no se construirá ningún video."
              exit 1
            fi
            args+=(--season "$SEASON")
          elif [[ -n "$SEASON" ]]; then
            echo "No se permite indicar temporada para evergreen."
            exit 1
          fi
          python main.py "${args[@]}"

      - name: Build original instrumental music and video (never uploads)
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'build-original' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ inputs.hours }}
        run: |
          python main.py make-original --hours "$MIX_HOURS"

      - name: Persist private state and generated outputs
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push

      - name: Confirm final Drive inventory
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-status

      - name: State safety boundaries
        if: always()
        run: |
          echo "No se configuró ni ejecutó ninguna subida a YouTube."
          echo "El workflow no contiene YOUTUBE_TOKEN_JSON ni la opción --upload."
          echo "Los archivos persistentes se guardan únicamente en Google Drive privado."
