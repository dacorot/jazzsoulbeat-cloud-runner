name: Jazz Soul Beat private cloud agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        type: choice
        options:
          - self-test
          - build-evergreen
      hours:
        description: "Duración del video evergreen aprobado (horas)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      collection:
        description: "Colección musical"
        required: true
        default: evergreen
        type: choice
        options:
          - evergreen
          - seasonal
      season:
        description: "Slug de temporada (solo seasonal; por ejemplo halloween)"
        required: false
        type: string
      agent_ref:
        description: "Rama o SHA del agente privado que se validará"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-private-cloud-agent
  cancel-in-progress: false

jobs:
  run-agent:
    name: Restore, run safely, and persist privately
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Validate private agent ref
        env:
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          if [[ -z "$AGENT_REF" || ! "$AGENT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ || "$AGENT_REF" == *..* || "$AGENT_REF" == */ || "$AGENT_REF" == *//* ]]; then
            echo "Rama o SHA del agente no válida."
            exit 1
          fi

      - name: Check out private agent (read-only token)
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ inputs.agent_ref }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test private agent
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Restore only the data needed for this cloud task
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          if [[ "${{ inputs.task }}" == "build-evergreen" ]]; then
            python main.py drive-pull-library
            python main.py scan
          else
            python main.py drive-pull-state
          fi
          python main.py drive-status

      - name: Start Deming PDCA cycle for requested cloud task
        id: pdca_start
        if: ${{ steps.restore.outcome == 'success' }}
        uses: ./.github/actions/pdca-start
        with:
          task: ${{ inputs.task }}
          objective: Execute the explicitly requested cloud task, verify its outputs and preserve all publication and rights gates
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Organize approved songs into their playlist folders
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'build-evergreen' }}
        working-directory: agent
        run: |
          echo "Only approved and fully rights-verified tracks are copied into tracks/playlists/."
          find tracks/playlists -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Show approved library status
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'build-evergreen' }}
        working-directory: agent
        run: python main.py library-status

      - name: Build synthetic technical test (never uploads)
        id: self_test
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'self-test' }}
        working-directory: agent
        run: python main.py self-test

      - name: Build an evergreen or seasonal video (never uploads)
        id: build_video
        if: ${{ steps.restore.outcome == 'success' && inputs.task == 'build-evergreen' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ inputs.hours }}
          COLLECTION: ${{ inputs.collection }}
          SEASON: ${{ inputs.season }}
        run: |
          args=(make --hours "$MIX_HOURS" --auto --collection "$COLLECTION")
          if [[ "$COLLECTION" == "seasonal" ]]; then
            if [[ ! "$SEASON" =~ ^[a-z0-9][a-z0-9_-]{0,39}$ ]]; then
              echo "Temporada inválida o ausente; no se construirá ningún video."
              exit 1
            fi
            args+=(--season "$SEASON")
          elif [[ -n "$SEASON" ]]; then
            echo "No se permite indicar temporada para evergreen."
            exit 1
          fi
          python main.py "${args[@]}"

      - name: Persist private state and generated outputs
        id: persist_outputs
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push

      - name: Verify and close requested-task PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"private-cloud-agent","task":"${{ inputs.task }}","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"restore_state","passed":${{ steps.restore.outcome == 'success' }}},{"name":"requested_task","passed":${{ (inputs.task == 'self-test' && steps.self_test.outcome == 'success') || (inputs.task == 'build-evergreen' && steps.build_video.outcome == 'success') }}},{"name":"private_drive_persistence","passed":${{ steps.persist_outputs.outcome == 'success' }}},{"name":"no_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; requested task outputs and private Drive inventory'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Confirm final Drive inventory
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-status

      - name: State safety boundaries
        if: always()
        run: |
          echo "No se configuró ni ejecutó ninguna subida a YouTube."
          echo "El workflow no contiene YOUTUBE_TOKEN_JSON ni la opción --upload."
          echo "Los archivos persistentes se guardan únicamente en Google Drive privado."
