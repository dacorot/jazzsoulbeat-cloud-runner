name: Jazz Soul Beat private cloud agent

on:
  push:
    paths:
      - "PRIVATE_CLOUD_AGENT_START.md"
  schedule:
    # One private two-hour production cycle every 48 hours (06:00 Colombia / 11:00 UTC).
    - cron: "0 11 */2 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        type: choice
        options:
          - self-test
          - build-evergreen
      hours:
        description: "Duración del video evergreen aprobado (horas)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      collection:
        description: "Colección musical"
        required: true
        default: evergreen
        type: choice
        options:
          - evergreen
          - seasonal
      season:
        description: "Slug de temporada (solo seasonal; por ejemplo halloween)"
        required: false
        type: string
      agent_ref:
        description: "Rama o SHA del agente privado que se validará"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string
      genre:
        description: "Género único del video"
        required: true
        default: jazz
        type: choice
        options:
          - jazz
          - soul
          - lofi

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-video-production
  cancel-in-progress: false

jobs:
  run-agent:
    name: Restore, run safely, and persist privately
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'build-evergreen' }}
      HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours || '2' }}
      COLLECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.collection || 'evergreen' }}
      SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
      AGENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref || 'fix/real-music-and-cinematic-motion' }}
      GENRE: ${{ github.event_name == 'workflow_dispatch' && inputs.genre || 'jazz' }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Validate private agent ref
        env:
          AGENT_REF: ${{ env.AGENT_REF }}
        run: |
          if [[ -z "$AGENT_REF" || ! "$AGENT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ || "$AGENT_REF" == *..* || "$AGENT_REF" == */ || "$AGENT_REF" == *//* ]]; then
            echo "Rama o SHA del agente no válida."
            exit 1
          fi

      - name: Check out private agent (read-only token)
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install -r requirements.txt

      - name: Compile and test private agent
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Restore production library and validate state
        id: restore_library
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          if [[ "${{ env.TASK }}" == "build-evergreen" ]]; then
            # The production library is a hard dependency for rendering.
            timeout 600s python main.py drive-pull-library
            timeout 120s python main.py migrate-manifests
            timeout 900s python main.py scan
          else
            python main.py drive-pull-state
          fi
          python main.py drive-status

      - name: Restore optional growth batch without blocking production
        id: restore_growth
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        continue-on-error: true
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set +e
          timeout --kill-after=10s 120s python main.py drive-pull-growth-batch
          code=$?
          if [[ "$code" == "124" ]]; then
            echo "::warning::Optional growth-batch restore timed out; production library remains usable and the growth batch will retry next cycle."
            exit 0
          fi
          exit "$code"

      - name: Show approved library status
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: python main.py library-status

      - name: Integrate approved original masters
        id: original_promotion
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          if [[ -d output/original-music/approved-stable-audio3-20261116 ]]; then
            python main.py prepare-original-promotion
            python main.py reconcile-music
          else
            echo "No approved original-music package; external licensed intake remains the active source."
          fi

      - name: Import rights-eligible library candidates
        id: library_promotion
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          set -euo pipefail
          candidates="output/library-promotion/eligible.json"
          if [[ ! -s "$candidates" && -s "output/library-promotion/eligible-external.json" ]]; then
            candidates="output/library-promotion/eligible-external.json"
          fi
          report="output/library-promotion/import-report.json"
          mkdir -p "$(dirname "$report")"
          if [[ -s "$candidates" ]]; then
            python main.py promote-library --candidates "$candidates" --report "$report"
            python main.py library-status
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            printf '{"approved": [], "rejected": [], "approved_seconds": 0, "publication": "DISABLED", "status": "NO_ELIGIBLE_BATCH"}\n' > "$report"
            echo "No hay lote elegible de derechos; el proceso continúa buscando fuentes."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist promoted production library
        id: persist_library
        if: ${{ steps.library_promotion.outcome == 'success' && steps.library_promotion.outputs.promoted == 'true' && env.TASK == 'build-evergreen' }}
        continue-on-error: true
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if ! timeout 120s python main.py drive-push-library; then
            echo "::warning::La persistencia del lote auxiliar no debe bloquear la producción; se conserva la biblioteca aprobada existente."
          fi
      - name: Write production library capacity evidence
        id: production_capacity
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
        run: |
          set -euo pipefail
          mkdir -p output/library-promotion
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          root = Path("tracks")
          manifests = [root / "library.csv", *sorted((root / "seasonal").glob("*/library.csv"))]
          approved = []
          for manifest in manifests:
              if not manifest.is_file():
                  continue
              with manifest.open(newline="", encoding="utf-8-sig") as handle:
                  for row in csv.DictReader(handle):
                      truthy = {"1", "true", "yes"}
                      if str(row.get("approved", "")).lower() in truthy and str(row.get("rights_verified", "")).lower() in truthy:
                          try:
                              seconds = float(row.get("duration_seconds") or row.get("duration") or 0)
                          except (TypeError, ValueError):
                              seconds = 0.0
                          if seconds > 0:
                              approved.append(row)
          target = int(float(os.environ["HOURS"]) * 3600)
          total = sum(float(row.get("duration_seconds") or row.get("duration") or 0) for row in approved)
          report = {
              "agent_id": "production_library_capacity",
              "source": "tracks/library.csv + tracks/seasonal/*/library.csv",
              "approved_tracks": len(approved),
              "approved_seconds": round(total, 2),
              "target_seconds": target,
              "status": "READY" if total >= target else "INSUFFICIENT",
              "rights_gate": "approved_and_rights_verified_only",
              "publication": "DISABLED",
          }
          Path("output/library-promotion/production-capacity.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Initialize or resume the sequential orchestrator checkpoint
        id: next_video
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          checkpoints = sorted(Path("output/orchestrator").glob("video-*.checkpoint.json"))
          active = []
          completed = []
          for path in checkpoints:
              try:
                  row = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              number = int(re.search(r"video-(\d+)", path.name).group(1))
              if row.get("status") == "COMPLETE" or row.get("stage") == "PDCA_COMPLETE":
                  completed.append(number)
              else:
                  active.append((number, row.get("video_id", f"video-{number:02d}")))
          if active:
              video_id = sorted(active)[0][1]
          else:
              # The first delivery already exists in the private history; when
              # no checkpoint has been restored, resume with the missing second
              # video instead of waiting for the full 12-video campaign.
              video_id = f"video-{(max(completed + [1]) + 1):02d}"
          print(f"Next per-video production target: {video_id}")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"video_id={video_id}\n")
          PY

      - name: Initialize or resume the sequential orchestrator checkpoint
        id: orchestrator_checkpoint
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORCHESTRATOR_VIDEO_ID: ${{ steps.next_video.outputs.video_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.orchestrator_agent import new_checkpoint, save_checkpoint
          video_id = os.environ.get("ORCHESTRATOR_VIDEO_ID") or "video-02"
          path = Path("output/orchestrator") / f"{video_id}.checkpoint.json"
          if path.exists():
              checkpoint = json.loads(path.read_text(encoding="utf-8"))
              print(f"Resumed orchestrator: {video_id} at {checkpoint.get('stage')}")
          else:
              checkpoint = new_checkpoint(video_id)
              save_checkpoint(path, checkpoint)
              print(f"Initialized orchestrator: {video_id} at {checkpoint['stage']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stage={checkpoint.get('stage')}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Orchestrator checkpoint\n\nVideo: `{video_id}`\nStage: `{checkpoint.get('stage')}`\n")
          PY

      - name: Check whether the approved library can satisfy the requested video
        id: production_gate
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
          GENRE: ${{ env.GENRE }}
          VIDEO_ID: ${{ steps.next_video.outputs.video_id }}
          JSB_PLAYLIST: ${{ env.COLLECTION == 'evergreen' && 'coffee_time' || env.SEASON }}
        run: |
          python - <<'PY'
          import os
          from curator import pick

          # This is a per-video gate. It must never require the complete
          # twelve-video campaign capacity before starting the next render.
          hours = float(os.environ["HOURS"])
          collection = os.environ["COLLECTION"]
          genre = os.environ["GENRE"]
          season = os.environ.get("SEASON") or None
          try:
              tracks, source_seconds = pick(hours * 3600, collection=collection, season=season, genre=genre)
          except SystemExit as exc:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("eligible=false\n")
              reason = str(exc)
              print("SKIPPED safely: " + reason)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Production gate\n\n**SKIPPED — no video was rendered.**\n\n" + reason + "\n")
              raise SystemExit(0)
          message = f"ELIGIBLE: {len(tracks)} approved tracks; {source_seconds/3600:.2f} source hours for a {hours:.2f}-hour render."
          print(message)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("eligible=true\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Production gate\n\n**ELIGIBLE** — " + message + "\n")

      - name: Start Deming PDCA cycle for requested cloud task
        id: pdca_start
        if: ${{ steps.restore_library.outcome == 'success' && (env.TASK == 'self-test' || steps.production_gate.outputs.eligible == 'true') }}
        uses: ./.github/actions/pdca-start
        with:
          task: ${{ env.TASK }}
          objective: Execute the explicitly requested cloud task, verify its outputs and preserve all publication and rights gates
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Build synthetic technical test (never uploads)
        id: self_test
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        run: python main.py self-test

      - name: Render short visual proof before longform
        id: visual_proof
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' && steps.production_gate.outputs.eligible == 'true' }}
        working-directory: agent
        run: |
          set -euo pipefail
          proof_image="$(find assets/visual-agents/approved-style-samples -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | sort | head -n 1)"
          test -n "$proof_image" || { echo "No approved visual proof image found"; exit 1; }
          mkdir -p output/visual-proof
          ffmpeg -nostdin -y -loglevel error -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 -t 10 output/visual-proof/silence.wav
          ffmpeg -nostdin -y -loglevel error -loop 1 -i "$proof_image" -i output/visual-proof/silence.wav \
            -t 10 -vf "scale=2560:1440:force_original_aspect_ratio=decrease,pad=2560:1440:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -ar 48000 -ac 2 output/visual-proof/proof.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name -of json output/visual-proof/proof.mp4

      - name: Build an evergreen or seasonal video
        id: build_video
        if: ${{ steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' && steps.production_gate.outputs.eligible == 'true' && steps.visual_proof.outcome == 'success' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
          GENRE: ${{ env.GENRE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Approved visual contract: one human-approved image per video.
          # Motion is limited to verified in-image effects; no scene factory
          # or multi-scene fallback may override that contract.
          export JSB_REQUIRE_MULTI_SCENE=0
          args=(make --hours "$MIX_HOURS" --auto --collection "$COLLECTION" --genre "$GENRE")
          if [[ "$COLLECTION" == "seasonal" ]]; then
            if [[ ! "$SEASON" =~ ^[a-z0-9][a-z0-9_-]{0,39}$ ]]; then
              echo "Temporada inválida o ausente; no se construirá ningún video."
              exit 1
            fi
            args+=(--season "$SEASON")
          elif [[ -n "$SEASON" ]]; then
            echo "No se permite indicar temporada para evergreen."
            exit 1
          fi
          timeout 2700s python main.py "${args[@]}"

      - name: Capture and validate the exact production render folder
        id: capture_render
        if: ${{ steps.build_video.outcome == 'success' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          JSB_REQUIRE_MULTI_SCENE: "0"
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          root = Path("output")
          candidates = []
          for folder in root.iterdir():
              if not folder.is_dir() or not folder.name.startswith("20"):
                  continue
              required = ["mix.mp3", "video.mp4", "thumb.jpg", "description.txt", "MUSIC_SOURCE.txt"]
              if all((folder / name).is_file() and (folder / name).stat().st_size > 0 for name in required):
                  candidates.append(folder)
          if not candidates:
              raise SystemExit("No se encontró una carpeta de render completa; no se sincronizará nada.")
          folder = max(candidates, key=lambda p: p.stat().st_mtime_ns)
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name,width,height,channels:format=duration", "-of", "json", str(folder / "video.mp4")],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          video = next((s for s in data.get("streams", []) if s.get("codec_type") == "video"), None)
          audio = next((s for s in data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert video and video.get("codec_name") == "h264", video
          assert (video.get("width"), video.get("height")) == (2560, 1440), video
          assert audio and audio.get("codec_name") == "aac" and audio.get("channels") == 2, audio
          duration = float(data["format"]["duration"])
          expected = float(os.environ["HOURS"]) * 3600
          assert abs(duration - expected) <= 3.0, (duration, expected)
          mix_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name:format=duration", "-of", "json", str(folder / "mix.mp3")],
              check=True, capture_output=True, text=True
          )
          mix_data = json.loads(mix_probe.stdout)
          mix_audio = next((s for s in mix_data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert mix_audio and mix_audio.get("codec_name") == "mp3", mix_data
          mix_duration = float(mix_data["format"]["duration"])
          assert abs(mix_duration - expected) <= 3.0, (mix_duration, expected)
          thumb_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=width,height", "-of", "json", str(folder / "thumb.jpg")],
              check=True, capture_output=True, text=True
          )
          thumb_data = json.loads(thumb_probe.stdout)
          thumb_stream = thumb_data.get("streams", [{}])[0]
          assert (thumb_stream.get("width"), thumb_stream.get("height")) == (1280, 720), thumb_data
          source_text = (folder / "MUSIC_SOURCE.txt").read_text(encoding="utf-8")
          source_entries = [line for line in source_text.splitlines() if line[:1].isdigit() and ". " in line[:6]]
          assert source_entries, "MUSIC_SOURCE.txt contains no individual track entries."
          provenance = folder / "VISUAL_SCENE_PROVENANCE.json"
          assert provenance.is_file(), "Falta procedencia visual del render."
          visual = json.loads(provenance.read_text(encoding="utf-8"))
          assert visual.get("status") == "SINGLE_APPROVED_IMAGE", visual
          assert visual.get("scene_count") == 1, visual
          assert visual.get("camera") == "locked", visual
          assert visual.get("motion_profile") in {"verified_scene_masks_localized_motion", "locked_camera_no_unsafe_overlays"}, visual
          assert visual.get("approved_image_sha256"), "Falta hash de la imagen aprobada."
          expected_hash = hashlib.sha256((folder / "video.mp4").read_bytes()).hexdigest()
          assert visual.get("video_sha256") == expected_hash, "El hash de video no coincide con su procedencia."
          quality = subprocess.run(
              ["python", "../scripts/visual_quality_gate.py", "--video", str(folder / "video.mp4"),
               "--provenance", str(provenance), "--config", "../config/visual_quality_gate.json",
               "--width", str(video["width"]), "--height", str(video["height"])],
              check=False, capture_output=True, text=True
          )
          print(quality.stdout)
          if quality.returncode != 0:
              raise SystemExit("Professional visual quality gate failed; private upload blocked.")
          effects = subprocess.run(
              ["python", "../scripts/visual_effect_audit.py", "--video", str(folder / "video.mp4"),
               "--provenance", str(provenance), "--effect-report", str(folder / "EFFECT_EXECUTION_REPORT.json"),
               "--output", str(folder / "EFFECT_AUDIT.json"),
               "--feedback", "output/learning/visual_feedback.jsonl"],
              check=False, capture_output=True, text=True
          )
          print(effects.stdout)
          learning = subprocess.run(
              ["python", "../scripts/visual_learning.py", "--feedback", "output/learning/visual_feedback.jsonl",
               "--model", "output/learning/visual_model.json"],
              check=False, capture_output=True, text=True
          )
          print(learning.stdout)
          if effects.returncode != 0:
              raise SystemExit("Visual effects audit failed; private upload blocked.")
          board = subprocess.run(
              ["python", "../scripts/video_release_board.py", "--run-dir", str(folder),
               "--expected-seconds", str(expected), "--output", str(folder / "VIDEO_RELEASE_BOARD.json")],
              check=False, capture_output=True, text=True
          )
          print(board.stdout)
          if board.returncode != 0:
              raise SystemExit("Release board requested repair; video was not approved for private upload.")
          print(f"PASS: {folder} | {duration:.2f}s | H.264 QHD | AAC estéreo")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_dir={folder.as_posix()}\n")
          PY

      - name: Persist generated visual scene library privately
        id: persist_visual_assets
        if: ${{ always() && steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' && steps.build_video.outcome != 'skipped' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python main.py drive-push-visual-assets
          python main.py drive-status

      - name: Persist only the validated production folder and production database
        id: persist_outputs
        if: ${{ always() && steps.restore_library.outcome == 'success' && env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success' && steps.capture_render.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          JSB_PRODUCTION_RUN_DIR: ${{ steps.capture_render.outputs.run_dir }}
        run: |
          set -euo pipefail
          python main.py drive-push-production
          python main.py drive-status

      - name: Upload exact approved artifact privately to YouTube
        id: youtube_private_upload
        if: ${{ steps.persist_outputs.outcome == 'success' }}
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          JSB_PRODUCTION_RUN_DIR: ${{ steps.capture_render.outputs.run_dir }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import autonomy
          import youtube_upload

          run_dir = Path(os.environ["JSB_PRODUCTION_RUN_DIR"])
          video = run_dir / "video.mp4"
          metadata = json.loads((run_dir / "metadata.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          approval_id = "private-auto-" + digest[:20]
          video_id = youtube_upload.upload(
              video, metadata["title"], metadata["description"], metadata["tags"],
              run_dir / "thumb.jpg", approval_id=approval_id,
          )
          (run_dir / "YOUTUBE_PRIVATE_UPLOAD.json").write_text(json.dumps({
              "status": "UPLOADED_PRIVATE", "video_id": video_id,
              "video_sha256": digest, "title": metadata["title"],
              "description_sha256": hashlib.sha256(metadata["description"].encode()).hexdigest(),
              "public_publication": False,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": "UPLOADED_PRIVATE", "video_id": video_id, "video_sha256": digest}))
          PY

      - name: Persist synthetic QA and autonomy state only
        id: persist_qa
        if: ${{ always() && steps.restore_library.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python main.py drive-push-qa
          python main.py drive-push-state

      - name: Verify and close requested-task PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"private-cloud-agent","task":"${{ env.TASK }}","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"restore_state","passed":${{ steps.restore_library.outcome == 'success' }}},{"name":"requested_task","passed":${{ (env.TASK == 'self-test' && steps.self_test.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success') }}},{"name":"private_drive_persistence","passed":${{ (env.TASK == 'self-test' && steps.persist_qa.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.persist_outputs.outcome == 'success') }}},{"name":"visual_library_persistence","passed":${{ env.TASK == 'self-test' || steps.persist_visual_assets.outcome == 'success' }}},{"name":"private_youtube_upload","passed":${{ env.TASK == 'self-test' || steps.youtube_private_upload.outcome == 'success' }}},{"name":"no_public_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; requested task outputs and private Drive inventory'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Confirm final Drive inventory
        if: ${{ always() && steps.restore_library.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-status

      - name: State safety boundaries
        if: always()
        run: |
          echo "La subida privada a YouTube usa el artefacto exacto aprobado; la publicación pública sigue bloqueada."
          echo "Los archivos persistentes se guardan en Google Drive privado."

