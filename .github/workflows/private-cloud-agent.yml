name: Jazz Soul Beat private cloud agent

on:
  push:
    paths:
      - "PRIVATE_CLOUD_AGENT_START.md"
  schedule:
    # Three private production drafts weekly: Monday, Wednesday and Friday at 06:00 Colombia (UTC-5).
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        type: choice
        options:
          - self-test
          - build-evergreen
      hours:
        description: "Duración del video evergreen aprobado (horas)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      collection:
        description: "Colección musical"
        required: true
        default: evergreen
        type: choice
        options:
          - evergreen
          - seasonal
      season:
        description: "Slug de temporada (solo seasonal; por ejemplo halloween)"
        required: false
        type: string
      agent_ref:
        description: "Rama o SHA del agente privado que se validará"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  run-agent:
    name: Restore, run safely, and persist privately
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'build-evergreen' }}
      HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours || '2' }}
      COLLECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.collection || 'evergreen' }}
      SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
      AGENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref || 'fix/real-music-and-cinematic-motion' }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Validate private agent ref
        env:
          AGENT_REF: ${{ env.AGENT_REF }}
        run: |
          if [[ -z "$AGENT_REF" || ! "$AGENT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ || "$AGENT_REF" == *..* || "$AGENT_REF" == */ || "$AGENT_REF" == *//* ]]; then
            echo "Rama o SHA del agente no válida."
            exit 1
          fi

      - name: Check out private agent (read-only token)
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test private agent
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Restore only the data needed for this cloud task
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          if [[ "${{ env.TASK }}" == "build-evergreen" ]]; then
            python main.py drive-pull-library
            python main.py scan
          else
            python main.py drive-pull-state
          fi
          python main.py drive-status

      - name: Show approved library status
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        run: python main.py library-status

      - name: Check whether the approved library can satisfy the requested video
        id: production_gate
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
        run: |
          python - <<'PY'
          import os
          from curator import pick

          hours = float(os.environ["HOURS"])
          collection = os.environ["COLLECTION"]
          season = os.environ.get("SEASON") or None
          try:
              tracks, source_seconds = pick(hours * 3600, collection=collection, season=season)
          except SystemExit as exc:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("eligible=false\n")
              print("SKIPPED safely: " + str(exc))
              raise SystemExit(0)
          print(f"ELIGIBLE: {len(tracks)} approved tracks; {source_seconds/3600:.2f} source hours for a {hours:.2f}-hour render.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("eligible=true\n")
          PY

      - name: Start Deming PDCA cycle for requested cloud task
        id: pdca_start
        if: ${{ steps.restore.outcome == 'success' && (env.TASK == 'self-test' || steps.production_gate.outputs.eligible == 'true') }}
        uses: ./.github/actions/pdca-start
        with:
          task: ${{ env.TASK }}
          objective: Execute the explicitly requested cloud task, verify its outputs and preserve all publication and rights gates
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Build synthetic technical test (never uploads)
        id: self_test
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        run: python main.py self-test

      - name: Build an evergreen or seasonal video (never uploads)
        id: build_video
        if: ${{ steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' && steps.production_gate.outputs.eligible == 'true' }}
        working-directory: agent
        env:
          MIX_HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          SEASON: ${{ env.SEASON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$COLLECTION" == "evergreen" ]]; then
            SCENE_MANIFEST="assets/visual-agents/midnight_jazz_soul/scenes/SCENE_MANIFEST.json"
            if ! python -c 'import json,sys; from pathlib import Path; from video import _validated_scene_selection; p=Path(sys.argv[1]); m=json.loads(p.read_text(encoding="utf-8")); assert m.get("status") in {"SCENE_SET_GENERATED_PENDING_HUMAN_QA","SCENE_SET_COMPLETE_WITH_DERIVED_VARIANTS_PENDING_HUMAN_QA"}; _validated_scene_selection(p,m,minimum_scenes=8)' "$SCENE_MANIFEST"; then
              echo "No hay una biblioteca visual completa; se intentará generarla solo con cuotas gratuitas."
              python scene_factory.py
            fi
            export JSB_REQUIRE_MULTI_SCENE=1
          fi
          args=(make --hours "$MIX_HOURS" --auto --collection "$COLLECTION")
          if [[ "$COLLECTION" == "seasonal" ]]; then
            if [[ ! "$SEASON" =~ ^[a-z0-9][a-z0-9_-]{0,39}$ ]]; then
              echo "Temporada inválida o ausente; no se construirá ningún video."
              exit 1
            fi
            args+=(--season "$SEASON")
          elif [[ -n "$SEASON" ]]; then
            echo "No se permite indicar temporada para evergreen."
            exit 1
          fi
          python main.py "${args[@]}"

      - name: Capture and validate the exact production render folder
        id: capture_render
        if: ${{ steps.build_video.outcome == 'success' }}
        working-directory: agent
        env:
          HOURS: ${{ env.HOURS }}
          COLLECTION: ${{ env.COLLECTION }}
          JSB_REQUIRE_MULTI_SCENE: ${{ env.COLLECTION == 'evergreen' && '1' || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          root = Path("output")
          candidates = []
          for folder in root.iterdir():
              if not folder.is_dir() or not folder.name.startswith("20"):
                  continue
              required = ["mix.mp3", "video.mp4", "thumb.jpg", "description.txt", "MUSIC_SOURCE.txt"]
              if all((folder / name).is_file() and (folder / name).stat().st_size > 0 for name in required):
                  candidates.append(folder)
          if not candidates:
              raise SystemExit("No se encontró una carpeta de render completa; no se sincronizará nada.")
          folder = max(candidates, key=lambda p: p.stat().st_mtime_ns)
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name,width,height,channels:format=duration", "-of", "json", str(folder / "video.mp4")],
              check=True, capture_output=True, text=True
          )
          data = json.loads(probe.stdout)
          video = next((s for s in data.get("streams", []) if s.get("codec_type") == "video"), None)
          audio = next((s for s in data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert video and video.get("codec_name") == "h264", video
          assert (video.get("width"), video.get("height")) == (2560, 1440), video
          assert audio and audio.get("codec_name") == "aac" and audio.get("channels") == 2, audio
          duration = float(data["format"]["duration"])
          expected = float(os.environ["HOURS"]) * 3600
          assert abs(duration - expected) <= 3.0, (duration, expected)
          mix_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name:format=duration", "-of", "json", str(folder / "mix.mp3")],
              check=True, capture_output=True, text=True
          )
          mix_data = json.loads(mix_probe.stdout)
          mix_audio = next((s for s in mix_data.get("streams", []) if s.get("codec_type") == "audio"), None)
          assert mix_audio and mix_audio.get("codec_name") == "mp3", mix_data
          mix_duration = float(mix_data["format"]["duration"])
          assert abs(mix_duration - expected) <= 3.0, (mix_duration, expected)
          thumb_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=width,height", "-of", "json", str(folder / "thumb.jpg")],
              check=True, capture_output=True, text=True
          )
          thumb_data = json.loads(thumb_probe.stdout)
          thumb_stream = thumb_data.get("streams", [{}])[0]
          assert (thumb_stream.get("width"), thumb_stream.get("height")) == (1280, 720), thumb_data
          source_text = (folder / "MUSIC_SOURCE.txt").read_text(encoding="utf-8")
          source_entries = [line for line in source_text.splitlines() if line[:1].isdigit() and ". " in line[:6]]
          assert source_entries, "MUSIC_SOURCE.txt contains no individual track entries."
          if os.environ.get("COLLECTION") == "evergreen" and os.environ.get("JSB_REQUIRE_MULTI_SCENE") == "1":
              provenance = folder / "VISUAL_SCENE_PROVENANCE.json"
              assert provenance.is_file(), "Falta procedencia de escenas."
              visual = json.loads(provenance.read_text(encoding="utf-8"))
              assert visual.get("scene_count", 0) >= 8
              expected_hash = hashlib.sha256((folder / "video.mp4").read_bytes()).hexdigest()
              assert visual.get("video_sha256") == expected_hash, "El hash de video no coincide con su procedencia."
          print(f"PASS: {folder} | {duration:.2f}s | H.264 QHD | AAC estéreo")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_dir={folder.as_posix()}\n")
          PY

      - name: Persist only the validated production folder and production database
        id: persist_outputs
        if: ${{ always() && steps.restore.outcome == 'success' && env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success' && steps.capture_render.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          JSB_PRODUCTION_RUN_DIR: ${{ steps.capture_render.outputs.run_dir }}
        run: |
          set -euo pipefail
          python main.py drive-push-production
          python main.py drive-status

      - name: Persist synthetic QA and autonomy state only
        id: persist_qa
        if: ${{ always() && steps.restore.outcome == 'success' && env.TASK == 'self-test' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python main.py drive-push-qa
          python main.py drive-push-state

      - name: Verify and close requested-task PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"private-cloud-agent","task":"${{ env.TASK }}","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"restore_state","passed":${{ steps.restore.outcome == 'success' }}},{"name":"requested_task","passed":${{ (env.TASK == 'self-test' && steps.self_test.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.build_video.outcome == 'success') }}},{"name":"private_drive_persistence","passed":${{ (env.TASK == 'self-test' && steps.persist_qa.outcome == 'success') || (env.TASK == 'build-evergreen' && steps.persist_outputs.outcome == 'success') }}},{"name":"no_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; requested task outputs and private Drive inventory'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Confirm final Drive inventory
        if: ${{ always() && steps.restore.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-status

      - name: State safety boundaries
        if: always()
        run: |
          echo "No se configuró ni ejecutó ninguna subida a YouTube."
          echo "El workflow no contiene YOUTUBE_TOKEN_JSON ni la opción --upload."
          echo "Los archivos persistentes se guardan únicamente en Google Drive privado."
