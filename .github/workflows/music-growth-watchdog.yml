name: Jazz Soul Beat music growth watchdog
# Intake policy updated in private agent 70961af683fa3c1a1f105e86cbf2133bfdd5794b
# Private agent review path normalization fixed in af1a789e24f5e2fea7fc268a445b9ae0f66fe808
# Each research stage now has an explicit timeout to prevent silent stalls.
# Runs serialize instead of cancelling valid work.

on:
  push:
    paths:
      - ".github/workflows/music-growth-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grow-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore complete persistent state
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 180s python main.py drive-pull-music-library
          python main.py library-status
          python main.py migrate-manifests

      - name: Discover, download and audit candidates
        id: research
        working-directory: agent
        run: |
          set -euo pipefail
          timeout 90s python main.py discover-incompetech
          timeout 180s python main.py download-incompetech
          timeout 120s python main.py inspect-incompetech
          timeout 120s python main.py audit-incompetech-sources
          timeout 120s python main.py audit-incompetech-track-pages
          timeout 120s python -c "import rights_audit; rights_audit.audit_incompetech()"
          timeout 120s python main.py discover-ketsa --limit 40
          timeout 180s python main.py download-ketsa --limit 40
          timeout 60s python main.py intake-library-growth

      - name: Promote only the eligible evidence-bound batch
        id: promote
        working-directory: agent
        run: |
          set -euo pipefail
          mkdir -p output/library-promotion
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("output/library-promotion/eligible-external.json")
          dst = Path("output/library-promotion/eligible.json")
          if not src.is_file():
              dst.write_text("[]\n", encoding="utf-8")
              print("No eligible external batch was produced.")
          else:
              rows = json.loads(src.read_text(encoding="utf-8"))
              if not isinstance(rows, list):
                  raise SystemExit("eligible-external.json is not a list")
              dst.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Eligible evidence-bound candidates: {len(rows)}")
          PY
          python main.py promote-library --candidates output/library-promotion/eligible.json --report output/library-promotion/import-report.json
          python main.py reconcile-music
          python main.py library-status

      - name: Persist growth, library and audit evidence
        if: always() && steps.restore.outcome == 'success'
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python main.py drive-push-growth-research
          python main.py drive-push
          python main.py drive-status

      - name: Leave an explicit failure when growth did not execute
        if: always()
        run: |
          test "${{ steps.restore.outcome }}" = success
          test "${{ steps.research.outcome }}" = success
          test "${{ steps.promote.outcome }}" = success
