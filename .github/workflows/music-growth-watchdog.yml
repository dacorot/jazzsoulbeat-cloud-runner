name: Jazz Soul Beat music growth watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jazz-soul-beat-music-growth-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch-and-intervene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore growth state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull-growth-batch

      - name: Check progress and intervene when idle
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          before=$(find tracks/review -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.flac' -o -iname '*.ogg' \) | wc -l)
          latest=$(find tracks/review output -type f \( -iname '*receipt*.json' -o -iname '*candidate*.csv' -o -iname '*.mp3' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 || true)
          echo "WATCHDOG_BEFORE_AUDIO=$before"
          echo "WATCHDOG_LATEST=$latest"

          python main.py discover-incompetech
          python main.py download-incompetech
          python main.py inspect-incompetech
          python main.py audit-incompetech-sources
          python main.py audit-incompetech-track-pages
          python main.py intake-library-growth
          python main.py drive-push-growth-research

          after=$(find tracks/review -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.flac' -o -iname '*.ogg' \) | wc -l)
          echo "WATCHDOG_AFTER_AUDIO=$after"
          if [ "$after" -le "$before" ]; then
            echo "::warning::No new review audio appeared during this watchdog cycle; agent intervention completed but progress remains zero."
          else
            echo "Watchdog confirmed new review audio: $((after-before)) file(s)."
          fi
