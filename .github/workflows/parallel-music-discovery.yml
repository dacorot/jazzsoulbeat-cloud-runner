name: Jazz Soul Beat - Parallel music discovery lanes
# Scheduled Deming cycle: all three lanes search, deduplicate, and stage review-only audio. Sources are partitioned per lane.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "MUSIC_PARALLEL_DISCOVERY_START.md"
      - ".github/workflows/parallel-music-discovery.yml"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  discover:
    name: "Discovery lane: ${{ matrix.lane }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: primary_catalogs
            offset: 0
            commands: "python main.py discover-ketsa --limit 100 || true; python main.py discover-incompetech && python main.py audit-incompetech-sources && python ../scripts/audit_rights_evidence.py --csv output/incompetech_candidates.csv --report output/parallel-discovery/primary_catalogs/rights-audit.json"
          - lane: community_catalogs
            offset: 0
            commands: "python main.py discover-ccmixter --limit 200 && python main.py discover-commons --limit 200 && python ../scripts/audit_rights_evidence.py --csv output/ccmixter_candidates.csv --report output/parallel-discovery/community_catalogs/rights-audit.json"
          - lane: independent_metadata
            offset: 40
            commands: "python ../scripts/music_agents.py && python main.py discover-ccmixter --limit 200 && python ../scripts/audit_rights_evidence.py --csv output/ccmixter_candidates.csv --report output/parallel-discovery/independent_metadata/rights-audit.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private-agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Run read-only discovery lane
        working-directory: agent
        env:
          DISCOVERY_LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          mkdir -p "output/parallel-discovery/${DISCOVERY_LANE}"
          { echo "lane=${DISCOVERY_LANE}"; echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          ${{ matrix.commands }} 2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          RIGHTS_CSV=""
          if [ -f output/incompetech_candidates.csv ]; then RIGHTS_CSV="output/incompetech_candidates.csv"; fi
          if [ -z "$RIGHTS_CSV" ] && [ -f output/ccmixter_candidates.csv ]; then RIGHTS_CSV="output/ccmixter_candidates.csv"; fi
          if [ -n "$RIGHTS_CSV" ]; then
            python ../scripts/rights_provenance_agent.py               --csv "$RIGHTS_CSV"               --output "output/parallel-discovery/${DISCOVERY_LANE}/rights-provenance.json"               2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          fi
          if [ "${DISCOVERY_LANE}" = "primary_catalogs" ] && [ -f output/incompetech_candidates.csv ]; then
            python ../scripts/seasonal_music_router.py --csv output/incompetech_candidates.csv --policy ../config/music_playlist_policy.json --approved-titles-file ../EDITORIAL_APPROVED_TITLES.txt --output "output/parallel-discovery/${DISCOVERY_LANE}/seasonal-routing.json" 2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          fi
          mapfile -t EXISTING_FILES < <(find output music-library -type f \( -name '*.csv' -o -name '*.json' \) ! \( -name '*_candidates.csv' -o -name 'candidate_catalog.csv' \) 2>/dev/null | sort)
          mapfile -t CANDIDATE_FILES < <(find output music-library -type f \( -name '*_candidates.csv' -o -name 'candidate_catalog.csv' \) 2>/dev/null | sort)
          python ../scripts/music_dedup_agent.py \
            --existing "${EXISTING_FILES[@]}" \
            --candidates "${CANDIDATE_FILES[@]}" \
            --output "output/parallel-discovery/${DISCOVERY_LANE}/dedup-report.json" \
            2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          mapfile -t EXISTING_FILES < <(find output music-library -type f \( -name '*.csv' -o -name '*.json' \) ! \( -name '*_candidates.csv' -o -name 'candidate_catalog.csv' \) 2>/dev/null | sort)
          mapfile -t CANDIDATE_FILES < <(find output music-library -type f \( -name '*_candidates.csv' -o -name 'candidate_catalog.csv' \) 2>/dev/null | sort)
          APPROVED_TITLES_ARGS=()
          if [ "${DISCOVERY_LANE}" = "primary_catalogs" ]; then
            APPROVED_TITLES_ARGS=(--approved-titles-file ../EDITORIAL_APPROVED_TITLES.txt)
          fi
          python ../scripts/review_audio_downloader.py \
            --existing "${EXISTING_FILES[@]}" \
            --candidates "${CANDIDATE_FILES[@]}" \
            --output "output/parallel-discovery/${DISCOVERY_LANE}/audio-review" \
            --limit 40 \
            --offset "${{ matrix.offset }}" \
            "${APPROVED_TITLES_ARGS[@]}" \
            2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
          python ../scripts/audit_review_audio.py \
            --manifest "output/parallel-discovery/${DISCOVERY_LANE}/audio-review/review-download-manifest.json" \
            --output "output/parallel-discovery/${DISCOVERY_LANE}/audio-review" \
            --report "output/parallel-discovery/${DISCOVERY_LANE}/audio-review/post-download-audit.json" \
            2>&1 | tee -a "output/parallel-discovery/${DISCOVERY_LANE}/run.txt"
      - name: Assert discovery remains review-only
        working-directory: agent
        run: |
          if grep -REn "rights_verified.*(True|true|1)|youtube_upload.*(PUBLIC|PUBLISHED)|PRIVATE_ONLY_AUTHORIZED" output/parallel-discovery; then
            echo "Unsafe approval/publication marker detected in discovery output"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-discovery-${{ matrix.lane }}
          path: agent/output/parallel-discovery/${{ matrix.lane }}
          if-no-files-found: error


  aggregate:
    name: "Deming aggregate and handoff audit"
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parallel-discovery-*
          path: aggregated
          merge-multiple: false
      - name: Build central handoff ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("aggregated")
          lanes = {}
          errors = []
          for manifest in root.glob("**/review-download-manifest.json"):
              lane = manifest.parents[1].name.removeprefix("parallel-discovery-")
              data = json.loads(manifest.read_text(encoding="utf-8"))
              lanes[lane] = {
                  "downloaded_count": data.get("downloaded_count", 0),
                  "skipped_count": data.get("skipped_count", 0),
                  "rights_verified": data.get("rights_verified", False),
                  "publication": data.get("publication", "UNKNOWN"),
              }
              if data.get("rights_verified") or data.get("publication") != "DISABLED":
                  errors.append(f"unsafe_state:{lane}")
          expected = {"primary_catalogs", "community_catalogs", "independent_metadata"}
          missing = sorted(expected - set(lanes))
          errors.extend(f"missing_lane:{lane}" for lane in missing)
          total = sum(item["downloaded_count"] for item in lanes.values())
          report = {
              "cycle": "PLAN->DO->CHECK->ACT",
              "status": "READY" if not errors else "REVIEW_REQUIRED",
              "lanes": lanes,
              "missing_lanes": missing,
              "total_downloaded_for_review": total,
              "errors": errors,
              "publication": "DISABLED",
          }
          Path("deming-ledger.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          if errors:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deming-central-ledger
          path: deming-ledger.json
          if-no-files-found: error


  supervise:
    name: "Private autonomous supervisor"
    needs: [discover, aggregate]
    if: ${{ always() && needs.discover.result == 'success' && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: autonomous-runtime
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: parallel-discovery-*
          path: agent/output/parallel-discovery
          merge-multiple: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private-agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Run orchestrator and QA handoff
        working-directory: agent
        run: |
          python main.py orchestrate-cycle
          python main.py deming-agent
      - name: Persist private state when Drive authorization exists
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          if [ -n "$DRIVE_TOKEN_JSON" ]; then
            python main.py persistence-agent --execute
          else
            echo "::warning::DRIVE_TOKEN_JSON is not configured; private persistence was not executed."
            python main.py persistence-agent
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-supervisor-report
          path: |
            agent/output/orchestrator-latest.json
            agent/output/deming-latest.json
            agent/output/persistence/latest.json
          if-no-files-found: warn
