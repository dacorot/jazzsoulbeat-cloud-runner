name: Continuous visual library production

on:
  push:
    paths:
      - "VISUAL_PRODUCTION_START.md"
  schedule:
    # Every two hours, serialized against every other private Drive mutation.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated visual categories or all"
        required: true
        default: "all"
        type: string
      per_category:
        description: "New candidates per category (free quota bounded)"
        required: true
        default: "2"
        type: string
      agent_ref:
        description: "Private agent branch or SHA"
        required: true
        default: "fix/real-music-and-cinematic-motion"
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  produce:
    name: Generate and persist visual candidates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref || 'fix/real-music-and-cinematic-motion' }}
      REQUESTED_CATEGORIES: ${{ github.event_name == 'workflow_dispatch' && inputs.categories || 'all' }}
      # Keep the scheduled path at the validated free-quota ceiling so the
      # 48-scene category library grows without manual dispatches.
      PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.per_category || '2' }}
    steps:
      - name: Check out controller
        uses: actions/checkout@v4

      - name: Validate bounded inputs
        run: |
          set -euo pipefail
          [[ "${AGENT_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]
          [[ "${PER_CATEGORY}" =~ ^[1-2]$ ]]
          [[ "${REQUESTED_CATEGORIES}" == "all" || "${REQUESTED_CATEGORIES}" =~ ^[a-z0-9_,-]+$ ]]

      - name: Check out private production agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore the private visual state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 600s python main.py drive-pull-visual-assets
          python -m compileall -q visual_library_producer.py cloud_backgrounds.py visual_directors.py

      - name: Resolve category rotation
        id: categories
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_CATEGORIES}" == "all" ]]; then
            echo 'value=midnight_jazz_soul coffee_smooth_jazz soulful_blues christian_jazz_gospel' >> "${GITHUB_OUTPUT}"
          else
            value="${REQUESTED_CATEGORIES//,/ }"
            echo "value=${value}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Produce a bounded candidate batch
        working-directory: agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          timeout 3600s python visual_library_producer.py \
            --categories ${{ steps.categories.outputs.value }} \
            --per-category "${PER_CATEGORY}"

      - name: Persist candidates and production report privately
        if: ${{ always() }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 600s python main.py drive-push-visual-assets
          if [[ -f output/visual-production/latest.json ]]; then
            python -m json.tool output/visual-production/latest.json
          fi
          python main.py drive-status

      - name: Publish run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-production-${{ github.run_id }}
          path: agent/output/visual-production/
          if-no-files-found: warn
          retention-days: 14
