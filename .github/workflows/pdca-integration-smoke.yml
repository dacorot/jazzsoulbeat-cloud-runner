name: PDCA composite action integration smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdca-integration-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-pdca-integration-smoke
  cancel-in-progress: false

jobs:
  pdca-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start PDCA using the shared composite action
        id: pdca_start
        uses: ./.github/actions/pdca-start
        with:
          task: pdca-composite-smoke
          objective: Verify shared planning and finish actions, autonomy policy, seeded memory and KPI export
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
      - name: Verify governance policy, memory and KPI report
        id: checks
        working-directory: agent
        run: |
          python main.py autonomy-status
          python main.py memory-list --limit 10
          python main.py performance-report --days 1 --save
          test -d output/performance
          test -n "$(find output/performance -type f -name 'PERFORMANCE_REPORT_1D_*.json' -print -quit)"
      - name: Finish PDCA using the shared composite action
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"pdca-composite-smoke","run_id":"${{ github.run_id }}","checks":"${{ steps.checks.outcome }}"}'
          checks_json: '[{"name":"governance_policy","passed":${{ steps.checks.outcome == 'success' }}},{"name":"three_layer_memory","passed":${{ steps.checks.outcome == 'success' }}},{"name":"kpi_report_export","passed":${{ steps.checks.outcome == 'success' }}},{"name":"publication_remains_disabled","passed":true}]'
          evidence: 'GitHub Actions run ${{ github.run_id }}; autonomy policy, seeded memory and KPI report'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
      - name: Persist smoke-test KPI report to private Drive
        if: ${{ always() && steps.checks.outcome == 'success' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-qa
