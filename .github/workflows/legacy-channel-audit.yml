name: Jazz Soul Beat - Legacy channel audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 0"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  audit:
    name: Audit legacy videos without modifying YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CONFIGURED: ${{ secrets.YOUTUBE_TOKEN_JSON != '' && secrets.DRIVE_TOKEN_JSON != '' && secrets.PRIVATE_REPO_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip safely when YouTube access is not configured
        if: ${{ env.YOUTUBE_CONFIGURED != 'true' }}
        run: |
          echo "Legacy audit skipped: required secrets are missing."
      - uses: actions/checkout@v4
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Run read-only legacy audit
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python main.py audit-legacy-channel
      - name: Prepare fail-closed remediation plan
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        working-directory: agent
        run: python main.py remediate-legacy-channel
      - name: Persist audit report privately
        if: ${{ env.YOUTUBE_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-channel-audit
      - name: State safety boundary
        if: always()
        run: |
          echo "Read-only legacy audit: no video, playlist or description was modified."
          echo "Deletion and public metadata changes remain disabled."
