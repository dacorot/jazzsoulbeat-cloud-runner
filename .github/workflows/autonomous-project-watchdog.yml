name: Autonomous project watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jazz-soul-beat-autonomous-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Restore persistent state
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull

      - name: Inventory and music audit
        id: inventory
        working-directory: agent
        run: |
          set -euo pipefail
          python main.py scan
          python main.py inventory-assets
          python main.py library-status

      - name: Audit visual contract
        id: visual_audit
        working-directory: agent
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, os
          from pathlib import Path
          root = Path("assets/visual-agents/midnight_jazz_soul")
          report_path = Path("output/qa/autonomous-visual-audit.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report = {"status": "PASS", "run_id": os.environ["RUN_ID"], "checks": []}
          def check(name, passed, detail):
              report["checks"].append({"name": name, "passed": bool(passed), "detail": detail})
              if not passed:
                  report["status"] = "FAIL"
          manifest_path = root / "manifest.json"
          if not manifest_path.is_file():
              check("manifest_exists", False, "Missing manifest")
          else:
              m = json.loads(manifest_path.read_text(encoding="utf-8"))
              rules, motion = m.get("visual_rules", {}), m.get("motion", {})
              check("anime_style", "anime" in rules.get("style", "").lower(), rules.get("style"))
              check("no_real_people", rules.get("real_people") is False, rules.get("real_people"))
              check("48_scene_target", m.get("season_or_category_target") == 48, m.get("season_or_category_target"))
              check("atmospheric_motion", motion.get("effect") == "layered atmospheric animation", motion.get("effect"))
              check("not_zoom_only", motion.get("status") != "current_zoom_only_loops_invalid_for_production", motion.get("status"))
          bases = sorted((root / "bases").glob("*.png")) if (root / "bases").is_dir() else []
          motion = sorted((root / "motion").glob("*.mp4")) if (root / "motion").is_dir() else []
          hashes = [hashlib.sha256(p.read_bytes()).hexdigest() for p in bases]
          check("active_batch", len(bases) == 12, len(bases))
          check("paired_motion", len(motion) == len(bases) == 12, f"{len(bases)} bases/{len(motion)} motion")
          check("unique_bases", len(set(hashes)) == len(hashes), f"{len(set(hashes))}/{len(hashes)}")
          invalid = []
          for p in motion:
              try:
                  d = subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(p)], text=True).strip()
                  if float(d) <= 0: invalid.append(p.name)
              except Exception:
                  invalid.append(p.name)
          check("readable_motion", not invalid, invalid)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["status"] != "PASS":
              raise SystemExit("Visual contract failed; no asset may advance.")
          PY

      - name: Persist evidence and heartbeat
        if: always() && steps.restore.outcome == 'success'
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          INVENTORY_STATUS: ${{ steps.inventory.outcome }}
          VISUAL_STATUS: ${{ steps.visual_audit.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("output/qa/autonomous-watchdog-heartbeat.json")
          p.write_text(json.dumps({
              "workflow": "autonomous-project-watchdog",
              "run_id": os.environ["RUN_ID"],
              "job_status": os.environ["JOB_STATUS"],
              "restore": os.environ["RESTORE_STATUS"],
              "inventory": os.environ["INVENTORY_STATUS"],
              "visual_audit": os.environ["VISUAL_STATUS"]
          }, indent=2) + "\n", encoding="utf-8")
          PY
          python main.py drive-push-qa
          python main.py drive-push-state
          python main.py drive-status

      - name: Fail visibly when an audit failed
        if: always()
        env:
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          INVENTORY_STATUS: ${{ steps.inventory.outcome }}
          VISUAL_STATUS: ${{ steps.visual_audit.outcome }}
        run: |
          test "$RESTORE_STATUS" = success
          test "$INVENTORY_STATUS" = success
          test "$VISUAL_STATUS" = success
