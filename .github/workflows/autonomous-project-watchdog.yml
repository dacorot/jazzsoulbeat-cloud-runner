name: Autonomous project watchdog

on:
  push:
    paths:
      - ".github/workflows/autonomous-project-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: agent
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Restore persistent state
        id: restore
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        # The watchdog audits policy state and visual references; never restore
        # production audio or the full private Drive archive on each pulse.
        run: python main.py drive-pull-audit-state
      - name: Inventory and music audit
        id: inventory
        working-directory: agent
        run: |
          set -euo pipefail
          python main.py inventory-assets
          python main.py library-status
      - name: Audit visual contract
        id: visual_audit
        working-directory: agent
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from visual_contract import validate_manifest
          root = Path("assets/visual-agents/midnight_jazz_soul")
          report_path = Path("output/qa/autonomous-visual-audit.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report = {"status": "PASS", "run_id": os.environ["RUN_ID"], "checks": []}
          def check(name, passed, detail):
              report["checks"].append({"name": name, "passed": bool(passed), "detail": detail})
              if not passed: report["status"] = "FAIL"
          scene_root = root / "scenes"
          manifest_path = scene_root / "SCENE_MANIFEST.json"
          if not manifest_path.is_file():
              check("scene_manifest_exists", False, str(manifest_path))
          else:
              try:
                  result = validate_manifest(
                      json.loads(manifest_path.read_text(encoding="utf-8")),
                      scene_root=scene_root,
                      minimum_scenes=48,
                  )
                  check("scene_manifest_contract", True, result)
              except Exception as exc:
                  check("scene_manifest_contract", False, f"{type(exc).__name__}: {exc}")
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["status"] != "PASS": raise SystemExit("Visual contract failed; no asset may advance.")
          PY
      - name: Persist evidence and heartbeat
        if: always() && steps.restore.outcome == 'success'
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          INVENTORY_STATUS: ${{ steps.inventory.outcome }}
          VISUAL_STATUS: ${{ steps.visual_audit.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("output/qa/autonomous-watchdog-heartbeat.json")
          p.write_text(json.dumps({
              "workflow": "autonomous-project-watchdog",
              "run_id": os.environ["RUN_ID"],
              "job_status": os.environ["JOB_STATUS"],
              "restore": os.environ["RESTORE_STATUS"],
              "inventory": os.environ["INVENTORY_STATUS"],
              "visual_audit": os.environ["VISUAL_STATUS"]
          }, indent=2) + "\n", encoding="utf-8")
          PY
          python main.py drive-push-qa
          python main.py drive-push-state
          python main.py drive-status
      - name: Notify Telegram of cycle result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          INVENTORY_STATUS: ${{ steps.inventory.outcome }}
          VISUAL_STATUS: ${{ steps.visual_audit.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not configured; heartbeat remains in Drive/GitHub."
            exit 0
          fi
          message="Jazz Soul Beat watchdog | run $RUN_ID | restore=$RESTORE_STATUS | inventory=$INVENTORY_STATUS | visual=$VISUAL_STATUS"
          curl --fail --silent --show-error --request POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=$message"
      - name: Fail visibly when an audit failed
        if: always()
        env:
          RESTORE_STATUS: ${{ steps.restore.outcome }}
          INVENTORY_STATUS: ${{ steps.inventory.outcome }}
          VISUAL_STATUS: ${{ steps.visual_audit.outcome }}
        run: |
          test "$RESTORE_STATUS" = success
          test "$INVENTORY_STATUS" = success
          test "$VISUAL_STATUS" = success
