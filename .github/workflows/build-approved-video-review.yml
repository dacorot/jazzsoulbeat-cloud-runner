name: Jazz Soul Beat - Build approved-audio QHD video review

on:
  workflow_dispatch:
    inputs:
      audio_request_id:
        description: "Request ID del audio con creatividad y derechos aprobados"
        required: true
        type: string
      agent_ref:
        description: "Rama o SHA del agente privado"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4

      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ inputs.agent_ref }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python and FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install private agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore private state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull-state

      - name: Locate requested approved audio ledger and scene
        id: locate
        working-directory: agent
        env:
          AUDIO_REQUEST_ID: ${{ inputs.audio_request_id }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          requested = os.environ["AUDIO_REQUEST_ID"]
          for ledger in sorted(Path("output/original-music").glob("*/approval_ledger.json")):
              data = json.loads(ledger.read_text(encoding="utf-8"))
              request = data.get("requests", {}).get(requested)
              if request:
                  scene = next(ledger.parent.glob("visual-review/cafe-library-clean-window-v2-candidate.png"), None)
                  if scene is None:
                      raise SystemExit(
                          f"No approved integrated-window scene beside {ledger}; "
                          "procedural full-frame rain is forbidden for production reviews"
                      )
                  print(f"ledger={ledger}")
                  print(f"scene={scene}")
                  raise SystemExit(0)
          raise SystemExit("Approved audio request was not found in restored private state")
          PY

      - name: Build QHD review and create separate video request
        id: build
        working-directory: agent
        env:
          PYTHONPATH: ..
        run: |
          OUTPUT="output/original-music/video-review-${{ github.run_id }}/video-review-qhd.mp4"
          python ../scripts/build_video_review.py \
            --ledger "${{ steps.locate.outputs.ledger }}" \
            --audio-request-id "${{ inputs.audio_request_id }}" \
            --image "${{ steps.locate.outputs.scene }}" \
            --output "$OUTPUT" \
            --rain-mode static_window \
            --duration 240 > video-review-request.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result=json.loads(Path("video-review-request.json").read_text())
          if result.get("status") != "VIDEO_REVIEW_PENDING": raise SystemExit(result)
          print("request_id=" + result["request_id"])
          PY

      - name: Notify reviewer of exact QHD video
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID: ${{ secrets.JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID }}
          JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID: ${{ secrets.JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID }}
        run: |
          python ../scripts/telegram_approval.py notify \
            --ledger "${{ steps.locate.outputs.ledger }}" \
            --request-id "${{ steps.build.outputs.request_id }}"

      - name: Persist private QHD review and updated ledger
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-state

      - name: Confirm private-only state
        run: echo "QHD video review created; no YouTube upload or public publication was attempted."
