name: Jazz Soul Beat - Read-only library eligibility diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Check out diagnostic controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ab8dcf30f66c652d386353e2819b5332f1f654c6
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Stage an isolated temporary agent copy
        env:
          SOURCE_AGENT: ${{ github.workspace }}/agent
          TEMP_AGENT: ${{ runner.temp }}/jsb-agent
        run: |
          set -euo pipefail
          rm -rf "$TEMP_AGENT"
          cp -a "$SOURCE_AGENT" "$TEMP_AGENT"
          test -d "$TEMP_AGENT"

      - name: Install pinned diagnostic dependencies
        env:
          TEMP_AGENT: ${{ runner.temp }}/jsb-agent
          LOCKFILE: ${{ github.workspace }}/.github/validation/requirements-diagnostic.lock
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/jsb-venv"
          "$RUNNER_TEMP/jsb-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes -r "$LOCKFILE"
          "$RUNNER_TEMP/jsb-venv/bin/python" -m compileall -q "$TEMP_AGENT"

      - name: Restore SQLite and original music manifests only
        working-directory: ${{ runner.temp }}/jsb-agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ''
          TELEGRAM_BOT_TOKEN: ''
          CLOUDFLARE_API_TOKEN: ''
          HF_TOKEN: ''
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 600s "$RUNNER_TEMP/jsb-venv/bin/python" main.py drive-pull-library
          timeout --signal=TERM --kill-after=20s 600s "$RUNNER_TEMP/jsb-venv/bin/python" main.py drive-pull-original-music

      - name: Generate read-only eligibility report
        working-directory: ${{ runner.temp }}/jsb-agent
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsb-venv/bin/python" ${{ github.workspace }}/scripts/library_eligibility_diagnostic.py \
            --agent-root . \
            --output output/diagnostics/library-eligibility/report.json
          test -s output/diagnostics/library-eligibility/report.json
          test -s output/diagnostics/library-eligibility/report.csv

      - name: Print individual diagnostic evidence
        working-directory: ${{ runner.temp }}/jsb-agent
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jsb-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/diagnostics/library-eligibility/report.json").read_text())
          print(json.dumps({
              "approved_rights_verified_count": report["approved_rights_verified_count"],
              "approved_rights_verified_seconds": report["approved_rights_verified_seconds"],
              "tracks": report["tracks"],
              "recent_original_candidates": report["recent_original_candidates"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload diagnostic reports as isolated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-eligibility-diagnostic
          path: ${{ runner.temp }}/jsb-agent/output/diagnostics/library-eligibility/
          if-no-files-found: error

      - name: Assert no production integrations were configured
        env:
          YOUTUBE_TOKEN_JSON: ''
          TELEGRAM_BOT_TOKEN: ''
          CLOUDFLARE_API_TOKEN: ''
          HF_TOKEN: ''
        run: |
          test -z "$YOUTUBE_TOKEN_JSON"
          test -z "$TELEGRAM_BOT_TOKEN"
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$HF_TOKEN"
          echo "Diagnostic completed: no YouTube, Telegram, Cloudflare or model-generation credentials configured."
