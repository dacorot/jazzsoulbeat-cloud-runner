name: Jazz Soul Beat - Retry exact private YouTube upload

on:
  push:
    paths:
      - ".github/workflows/retry-private-youtube-upload.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-upload-recovery
  cancel-in-progress: false

env:
  JSB_PRODUCTION_RUN_DIR: output/20261125-200035-321569
  AGENT_REF: f7ecd1b

jobs:
  upload:
    name: Restore and upload the exact validated production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore the exact validated production folder from private Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 900s python - <<'PY'
          import json, os
          import drive_storage

          store = drive_storage.DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"])
          result = store.pull(paths=(os.environ["JSB_PRODUCTION_RUN_DIR"] + "/",))
          print(json.dumps(result, ensure_ascii=False))
          PY
          test -s "$JSB_PRODUCTION_RUN_DIR/video.mp4"
          test -s "$JSB_PRODUCTION_RUN_DIR/thumb.jpg"
          test -s "$JSB_PRODUCTION_RUN_DIR/metadata.json"

      - name: Repair compact credits without changing the video
        working-directory: agent
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ["JSB_PRODUCTION_RUN_DIR"]) / "metadata.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          description = data["description"]
          if "source:" not in description.casefold():
              description += "\nSOURCE: Full source URLs, hashes and attribution evidence are retained in the private release manifest."
              data["description"] = description
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Added missing Source marker to metadata only.")
          else:
              print("Source marker already present.")
          PY

      - name: Upload exact validated artifact privately to YouTube
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, traceback
          from pathlib import Path
          import youtube_upload

          run_dir = Path(os.environ["JSB_PRODUCTION_RUN_DIR"])
          video = run_dir / "video.mp4"
          thumb = run_dir / "thumb.jpg"
          metadata = json.loads((run_dir / "metadata.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          print(json.dumps({"run_dir": str(run_dir), "video_bytes": video.stat().st_size, "video_sha256": digest}))
          try:
              video_id = youtube_upload.upload(
                  video, metadata["title"], metadata["description"], metadata["tags"],
                  thumb, approval_id="private-auto-" + digest[:20],
              )
          except Exception as exc:
              print(f"YouTube private upload failed: {type(exc).__name__}: {exc}")
              traceback.print_exc()
              raise
          (run_dir / "YOUTUBE_PRIVATE_UPLOAD.json").write_text(json.dumps({
              "status": "UPLOADED_PRIVATE", "video_id": video_id,
              "video_sha256": digest, "title": metadata["title"],
              "description_sha256": hashlib.sha256(metadata["description"].encode()).hexdigest(),
              "public_publication": False,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": "UPLOADED_PRIVATE", "video_id": video_id, "video_sha256": digest}))
          PY

      - name: Persist upload receipt and repaired metadata privately
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          JSB_PRODUCTION_RUN_DIR: ${{ env.JSB_PRODUCTION_RUN_DIR }}
        run: python main.py drive-push-production

      - name: Confirm no public publication
        run: echo "Exact artifact uploaded privately; public publication remains blocked pending owner approval."
