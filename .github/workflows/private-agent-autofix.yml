name: Jazz Soul Beat - private agent auto-fix

on:
  push:
    paths:
      - ".github/workflows/private-agent-autofix.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jazz Soul Beat development agents supervisor"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-private-agent-autofix
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOFIX_TOKEN: ${{ secrets.PRIVATE_REPO_AUTOFIX_TOKEN }}
      AGENT_BRANCH: fix/real-music-and-cinematic-motion
    steps:
      - name: Check whether repair is required
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'failure' }}
        run: echo "Supervisor completed successfully; no auto-fix required."

      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_AUTOFIX_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply only allowlisted repairs
        working-directory: agent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repairs = []
          targets = [Path("visual_contract.py"), Path("tests/test_visual_contract.py")]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              repaired = text.replace("\\n", "\n")
              if repaired != text:
                  path.write_text(repaired, encoding="utf-8")
                  repairs.append(f"newline-literal:{path}")

          path = Path("visual_contract.py")
          text = path.read_text(encoding="utf-8")
          Path("autofix-report.txt").write_text(
              "\n".join(repairs) + ("\n" if repairs else "NO_SAFE_REPAIR\n"),
              encoding="utf-8",
          )
          print("\n".join(repairs) if repairs else "NO_SAFE_REPAIR")
          PY

      - name: Verify repaired branch
        working-directory: agent
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q tests/test_visual_contract.py tests/test_visual_directors.py tests/test_scene_factory.py
          test -s autofix-report.txt
          if grep -qx "NO_SAFE_REPAIR" autofix-report.txt; then
            echo "No allowlisted repair matched; no branch or PR will be created."
            exit 0
          fi

      - name: Create isolated repair branch and pull request
        if: success()
        working-directory: agent
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_AUTOFIX_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="autofix/run-${RUN_ID}"
          git config user.name "Jazz Soul Beat AutoFix"
          git config user.email "autofix@jazzsoulbeat.invalid"
          git checkout -b "$branch"
          git add visual_contract.py tests/test_visual_contract.py
          git commit -m "Auto-fix allowlisted visual contract regression"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dacorot/jazzsoulbeat-agent.git"
          git push --set-upstream origin "$branch"
          gh pr create             --repo dacorot/jazzsoulbeat-agent             --base "${AGENT_BRANCH}"             --head "$branch"             --title "Auto-fix visual contract regression"             --body "Allowlisted repair generated by the development supervisor. Tests passed before opening this PR. Run: ${RUN_ID}."
