name: Private agent preflight (no upload)
on:
  workflow_dispatch:
  schedule:
    - cron: "41 12 * * 2"
permissions:
  contents: read
jobs:
  validate:
    name: Reusable private-agent QA
    uses: ./.github/workflows/reusable-private-agent.yml
    with:
      agent_repository: dacorot/jazzsoulbeat-agent
      agent_ref: fix/real-music-and-cinematic-motion
      python_version: "3.11"
    secrets:
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
