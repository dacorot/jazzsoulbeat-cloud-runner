name: Private agent preflight (no upload)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-agent-preflight.yml"
      - ".github/workflows/reusable-private-agent.yml"
  schedule:
    # Every six hours, UTC: 19:00, 01:00, 07:00 and 13:00 Colombia time. PDCA and KPI state are persisted after each pulse; safety-event tracking and three-layer memory are regression-tested.
    - cron: "0 */6 * * *"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false
jobs:
  validate:
    name: Reusable private-agent QA
    uses: ./.github/workflows/reusable-private-agent.yml
    with:
      agent_repository: dacorot/jazzsoulbeat-agent
      agent_ref: fix/real-music-and-cinematic-motion
      python_version: "3.11"
    secrets:
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
