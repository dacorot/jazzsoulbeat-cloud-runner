name: Private agent preflight (no upload)
on:
  workflow_dispatch:
  schedule:
    # Every six hours, staggered: 21:00, 03:00, 09:00 and 15:00 Colombia time. PDCA and KPI state are persisted after each pulse; safety-event tracking and three-layer memory are regression-tested.
    - cron: "0 2,8,14,20 * * *"
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false
jobs:
  validate:
    name: Reusable private-agent QA
    uses: ./.github/workflows/reusable-private-agent.yml
    with:
      agent_repository: dacorot/jazzsoulbeat-agent
      agent_ref: fix/real-music-and-cinematic-motion
      python_version: "3.11"
    secrets:
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}

# 2026-11-14: regression validation for scoped original-music Drive persistence and review-only sync boundaries.
