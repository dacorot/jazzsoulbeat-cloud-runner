name: Jazz Soul Beat - Parallel Production Control
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/parallel-production.yml"
      - "scripts/music_agents.py"
      - "scripts/delivery_coordinator.py"
      - "scene_factory.py"
      - "cloud_backgrounds.py"
      - "visual_directors.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-parallel-production
  cancel-in-progress: false

# Independent lanes run concurrently. They exchange artifacts, not mutable shared
# Drive/database state. No lane uploads to YouTube or publishes publicly.
jobs:
  music-discovery:
    name: Music discovery and rights-first screening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install audio inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent music discovery agents
        run: python scripts/music_agents.py
      - name: Split audio delivery into transfer-safe bundles
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path("music-library")
          root = Path("music-delivery")
          files = sorted((source / "candidates").glob("*")) if (source / "candidates").exists() else []
          bins = [[] for _ in range(5)]
          sizes = [0] * 5
          for path in sorted(files, key=lambda p: p.stat().st_size, reverse=True):
              index = min(range(5), key=lambda i: sizes[i])
              bins[index].append(path)
              sizes[index] += path.stat().st_size
          for index, group in enumerate(bins, 1):
              target = root / f"audio-part-{index}"
              target.mkdir(parents=True, exist_ok=True)
              for path in group:
                  shutil.copy2(path, target / path.name)
              print(f"audio-part-{index}: {len(group)} files, {sizes[index-1]} bytes")
          reports = root / "reports"
          reports.mkdir(parents=True, exist_ok=True)
          for path in source.rglob("*"):
              if path.is_file() and path.parent.name != "candidates":
                  shutil.copy2(path, reports / path.name)
          PY
      - name: Preserve music screening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-discovery-reports
          path: music-delivery/reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Deliver audio bundle 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-audio-1
          path: music-delivery/audio-part-1/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Deliver audio bundle 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-audio-2
          path: music-delivery/audio-part-2/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Deliver audio bundle 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-audio-3
          path: music-delivery/audio-part-3/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Deliver audio bundle 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-audio-4
          path: music-delivery/audio-part-4/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Deliver audio bundle 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-music-audio-5
          path: music-delivery/audio-part-5/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  visual-directors:
    name: Four visual directors and original scene library
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test category isolation, master identity and character continuity
        working-directory: agent
        run: |
          python -m compileall -q visual_directors.py cloud_backgrounds.py scene_factory.py
          python -m pytest -q tests/test_visual_directors.py tests/test_cloud_backgrounds.py tests/test_scene_factory.py
      - name: Generate eight original Midnight Jazz scenes (free account only)
        if: contains(github.event.head_commit.message, '[generate-scenes]')
        working-directory: agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scene_factory.py
      - name: Preserve visual director test report
        if: always()
        working-directory: agent
        run: |
          mkdir -p output/visual-scenes
          echo "Visual director lane completed. See preceding pytest output." > output/visual-scenes/visual-directors-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-visual-directors-report
          path: |
            agent/assets/visual-agents/midnight_jazz_soul/scenes/
            agent/output/visual-scenes/
          if-no-files-found: warn
          retention-days: 30

  rights-regression:
    name: Music rights and provenance regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run rights, license and source-audit tests
        working-directory: agent
        run: |
          python -m unittest -v \
            tests.test_licenses \
            tests.test_incompetech_rights_audit \
            tests.test_incompetech_source_audit \
            tests.test_incompetech_track_pages \
            tests.test_incompetech_review_mix \
            tests.test_ketsa_catalog \
            tests.test_ketsa_review_pack
      - name: Install FFmpeg for audio inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture official Incompetech license and track evidence
        working-directory: agent
        run: |
          python main.py discover-incompetech
          python main.py audit-incompetech-sources
          python main.py audit-incompetech-track-pages
          python main.py download-incompetech
          python main.py inspect-incompetech
          python rights_audit.py incompetech
          python incompetech_review_mix.py
      - name: Preserve Incompetech evidence and review audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incompetech-first-video-review
          path: |
            agent/output/first-video-review/
            agent/output/incompetech_candidates.csv
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_AUDIT.csv
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_EVIDENCE.json
            agent/tracks/review/incompetech/source_audit.csv
            agent/tracks/review/incompetech/source_evidence.json
            agent/tracks/review/incompetech/track_page_audit.csv
            agent/tracks/review/incompetech/track_page_evidence.json
            agent/tracks/review/incompetech/inspection_report.csv
            agent/tracks/review/incompetech/download_receipt.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Preserve rights regression report
        if: always()
        run: |
          mkdir -p reports
          echo "Rights regression lane completed. See preceding unittest output." > reports/rights-regression.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-rights-regression-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  video-engine-qa:
    name: Video engine synthetic render and media validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python dependencies
        working-directory: agent
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run synthetic end-to-end video test
        working-directory: agent
        run: python main.py self-test
      - name: Verify synthetic MP4 and audio with FFprobe
        working-directory: agent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          folders = sorted(Path("output").glob("self-test-*"))
          if not folders:
              raise SystemExit("No self-test output folder was produced.")
          folder = folders[-1]
          videos = list(folder.glob("*.mp4"))
          audios = list(folder.glob("*.mp3"))
          if not videos or not audios:
              raise SystemExit(f"Missing synthetic media in {folder}")
          for media in videos + audios:
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration,size",
                   "-of", "json", str(media)],
                  check=True, capture_output=True, text=True,
              )
              data = json.loads(probe.stdout)["format"]
              if float(data["duration"]) <= 0 or int(data["size"]) <= 0:
                  raise SystemExit(f"Invalid media: {media}")
              print(json.dumps({"file": str(media), **data}))
          PY
      - name: Preserve synthetic QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-video-engine-qa
          path: agent/output/self-test-*/
          if-no-files-found: warn
          retention-days: 7


  first-video-review-render:
    name: Assemble first 2h20 QHD private review video
    if: always()
    needs:
      - rights-regression
      - visual-directors
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private video engine
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and render dependencies
        working-directory: agent
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Collect private review audio
        if: needs.rights-regression.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: incompetech-first-video-review
          path: incoming/audio/
      - name: Collect original visual scenes
        if: needs.visual-directors.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: parallel-visual-directors-report
          path: incoming/visual/
      - name: Render and verify the 2h20 QHD private review video
        if: needs.rights-regression.result == 'success' && needs.visual-directors.result == 'success'
        working-directory: agent
        run: python first_video_review.py --incoming incoming --output output/first-video-private-review
      - name: Record blocked status when a required lane did not complete
        if: always() && (needs.rights-regression.result != 'success' || needs.visual-directors.result != 'success')
        working-directory: agent
        env:
          RIGHTS_RESULT: ${{ needs.rights-regression.result }}
          VISUAL_RESULT: ${{ needs.visual-directors.result }}
        run: |
          mkdir -p output/first-video-private-review
          printf '# First video review blocked\\n\\nRights lane: %s\\nVisual lane: %s\\nNo video was rendered.\\n' "$RIGHTS_RESULT" "$VISUAL_RESULT" > output/first-video-private-review/BLOCKED.md
      - name: Preserve private review render and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-first-video-review
          path: agent/output/first-video-private-review/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  coordinator-delivery:
    name: Coordinator - assemble delivery package and readiness gates
    if: always()
    needs:
      - music-discovery
      - visual-directors
      - rights-regression
      - video-engine-qa
      - first-video-review-render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect outputs from every completed lane
        uses: actions/download-artifact@v4
        with:
          pattern: parallel-*
          path: incoming/
          merge-multiple: true
      - name: Inventory, checksum and gate delivered assets
        run: python scripts/delivery_coordinator.py incoming delivery-package
      - name: Preserve integrated delivery package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-delivery-package
          path: delivery-package/
          if-no-files-found: error
          retention-days: 30

  coordinator-summary:
    name: Coordinator summary
    if: always()
    needs:
      - music-discovery
      - visual-directors
      - rights-regression
      - video-engine-qa
      - first-video-render
    runs-on: ubuntu-latest
    steps:
      - name: Report independent lane results
        env:
          MUSIC: ${{ needs.music-discovery.result }}
          VISUAL: ${{ needs.visual-directors.result }}
          RIGHTS: ${{ needs.rights-regression.result }}
          VIDEO: ${{ needs.video-engine-qa.result }}
          FIRST_VIDEO: ${{ needs.first-video-review-render.result }}
        run: |
          {
            echo "## Jazz Soul Beat - Parallel production report"
            echo ""
            echo "| Workstream | Result |"
            echo "|---|---|"
            echo "| Music discovery | $MUSIC |"
            echo "| Visual directors | $VISUAL |"
            echo "| Rights regression | $RIGHTS |"
            echo "| Video engine QA | $VIDEO |"
            echo "| First video render | $FIRST_VIDEO |"
            echo ""
            echo "These are independent QA/discovery lanes. No YouTube upload or public publication is performed."
            echo "A passing technical test does not constitute rights approval or final creative approval."
          } >> "$GITHUB_STEP_SUMMARY"
