name: Create private Jazz Soul Beat reference folders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-reference-folders.yml"
      # Also reports file names in the private reference folders; no sharing changes.
      # Also lists files directly in the private reference-library root.
      # Also inventories the private storage root for uploaded source assets.
      # Checks the user-shared folder IDs across shared drives.
      # Searches connected Drive for user-owned visual masters.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: jazzsoulbeat-drive-reference-folders
  cancel-in-progress: false

jobs:
  create-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Drive dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start PDCA cycle for private reference-folder setup
        id: pdca_start
        uses: ./.github/actions/pdca-start
        with:
          task: private-reference-folder-setup
          objective: Create or reuse the required private Drive reference folders without changing sharing permissions
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Create or reuse reference folders in private Drive
        id: create_folders
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python drive_reference_folders.py

      - name: Confirm private-only operation
        id: private_guard
        run: echo "Folders created or reused inside the existing private Jazz Soul Beat Drive storage. No sharing or publication changed."

      - name: Verify and close private folder setup PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"private-reference-folder-setup","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: '[{"name":"drive_reference_folders_created_or_reused","passed":${{ steps.create_folders.outcome == 'success' }}},{"name":"private_only_sharing_guard","passed":${{ steps.private_guard.outcome == 'success' }}},{"name":"no_publication","passed":true}]'
          evidence: 'GitHub Actions run ${{ github.run_id }}; private Drive folder setup report'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Record folder setup result on commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=success
          if [ "$RESULT" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Jazz Soul Beat / reference folders" \
            -f description="Private Drive folder setup: $RESULT; sharing unchanged."
