name: Validate Jazz Soul Beat agent PR #11
# Isolated synthetic fixture validates metadata gates, FFmpeg mixing, scene-aware animation, 2K QHD background normalization and 2560x1440 video output; it is not production music.
# Every run checks out the current private PR branch and logs its exact commit SHA. The synthetic fixture supplies explicit test-only metadata to exercise the production gate. The suite also exercises Ketsa policy-link validation and the isolated audition-pack guards. It also asserts license links and modification notices in per-track credits. Latest unit-test assertion wording has been aligned with the explicit failure message. Tracklist timestamps now subtract the shared crossfade duration. The first minute now uses YouTube-friendly zero-padded MM:SS timestamps. The review-pack command now optionally renders a private ambient-motion MP4 and provenance hashes. Provenance now records the exact private-agent and controller revisions.
# Fixture audio is synthetic and test-only; it is never approved in the production library or uploaded. Drive artifact assertion now follows the store's deterministic lexical path order.
# The suite verifies source-tag groove continuity, a strict greater-than-three-minute production track minimum, a six-minute preferred track length, 18-second equal-power qsin/iqsin crossfades, and a private audition capped at the first eight eligible full-length candidates, each longer than 3 minutes with up to 6 minutes of preview audio. It also verifies private Drive artifact URLs with SHA-256, prefix-scoped restores, early stopping in quality-ranked Ketsa discovery, sequential audio crossfades, source-tag seasonal music ordering, explicit human-free seasonal prompts, seamless falling autumn leaves, approval-gated playlist copies, and safe stale-copy cleanup, and exact rejected-run pruning and empty playlist directory creation and concise sync reporting. Ketsa discovery now resolves official WordPress taxonomy tags for explicit genre, instrument, mood and energy metadata before ranking. The rejected procedural generator and its CLI entry point have been removed from the private agent branch. Ketsa audition packs and discovery now restrict candidates to explicit Jazz, Soul, lo-fi, Hip Hop, Boom Bap, Trip Hop or R&B tags; broad funk-only, R&B-only, generic instrumental-only and unrelated tracks are excluded; trip-hop is explicitly supported by the library gate and curator ranking; generic instrumental-only and R&B-only entries cannot pass discovery. Current fixture includes explicit genre/instrument/mood fields required by the production curator.

# Refresh trigger: rerun against the latest private-agent branch head after anime prompt length and regression-test fixes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-agent-pr10.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jazzsoulbeat-quality-fix
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and licensed-track pipeline integration render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out public validation controller
        uses: actions/checkout@v4

      - name: Check out private agent PR #11 branch
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact private-agent revision under test
        working-directory: agent
        run: |
          echo "Agent revision:"
          git rev-parse HEAD
          echo "Commit message:"
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify preinstalled FFmpeg
        run: |
          command -v ffmpeg
          ffmpeg -version | head -n 2
          command -v ffprobe
          ffprobe -version | head -n 2

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python files
        working-directory: agent
        run: python -m compileall -q .

      - name: Run complete unit test suite
        working-directory: agent
        run: python -m unittest discover -s tests -v

      - name: Run real FFmpeg synthetic video self-test
        working-directory: agent
        run: python main.py self-test

      - name: Prepare isolated test-only approved-track fixture
        working-directory: agent
        env:
          JSB_BACKGROUND_IMAGE: validation-background.jpg
        run: |
          set -euo pipefail
          python -c "from PIL import Image; Image.new('RGB', (2560, 1440), (30, 24, 20)).save('validation-background.jpg', quality=90)"
          mkdir -p tracks/ci
          ffmpeg -nostdin -y -loglevel error -f lavfi -i "sine=frequency=220:duration=360" -c:a libmp3lame -b:a 192k tracks/ci/fixture.mp3
          python - <<'PY'
          from pathlib import Path
          from db import conn
          track = str(Path("tracks/ci/fixture.mp3").resolve())
          c = conn()
          c.execute("DELETE FROM tracks")
          c.execute(
              """INSERT INTO tracks(file,title,artist,license,source_url,approved,duration,
                 rights_verified,license_url,collection,season,genre,instruments,mood,energy)
                 VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
              (track, "CI TEST FIXTURE — NOT FOR RELEASE", "Jazz Soul Beat CI",
               "TEST ONLY", "https://example.invalid/ci-fixture", 1, 360.0, 1,
               "https://creativecommons.org/licenses/by/4.0/", "evergreen", "",
               "jazz (synthetic CI fixture only)", "synthetic sine tone; no real instruments",
               "test fixture only", "test"),
          )
          c.commit()
          c.close()
          print("Inserted isolated synthetic CI fixture; no production rights are asserted.")
          PY

      - name: Render short integration video through the approved-track pipeline using an isolated synthetic fixture
        working-directory: agent
        env:
          JSB_BACKGROUND_IMAGE: validation-background.jpg
        run: python main.py make --hours 0.01 --auto

      - name: Verify mixed audio, animated MP4 streams, and exact duration
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find output -type f -name video.mp4 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          RUN_DIR="$(dirname "$VIDEO")"
          test -s "$RUN_DIR/mix.mp3"
          test -s "$RUN_DIR/MUSIC_SOURCE.txt"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels -of json "$VIDEO" > production-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("production-probe.json").read_text())
          duration = float(data["format"]["duration"])
          streams = data["streams"]
          assert 35 <= duration <= 37, f"Unexpected integration render duration: {duration}"
          video = next(s for s in streams if s["codec_type"] == "video")
          audio = next(s for s in streams if s["codec_type"] == "audio")
          assert video["codec_name"] == "h264", video
          assert (video["width"], video["height"]) == (2560, 1440), video
          assert audio["codec_name"] == "aac" and audio["channels"] == 2, audio
          print(f"PASS: {duration:.2f}s H.264 2560x1440 2K QHD + AAC stereo")
          print("PASS: mix.mp3 and MUSIC_SOURCE.txt present")
          PY
          rm -f "$VIDEO" production-probe.json "$RUN_DIR/mix.mp3" "$RUN_DIR/thumb.jpg" "$RUN_DIR/description.txt" "$RUN_DIR/MUSIC_SOURCE.txt"
          rm -f tracks/ci/fixture.mp3 validation-background.jpg

      - name: Confirm no publishing or Drive writes
        run: |
          echo "Production render only: no YouTube credentials, upload, Google Drive restore, or Drive push."

# Revalidate current private-agent head f87c3cc5b9b97a4d0e91a44aea5761bda846187a after the new official-source catalog and audit modules.
