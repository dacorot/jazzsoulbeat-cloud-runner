name: Validate Jazz Soul Beat agent PR #10
# Full production-duration render is isolated: no Drive restore/push and no YouTube credentials.
# Re-run after PR #10 melodic-answer correction and visual-direction documentation update.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-agent-pr10.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jazzsoulbeat-pr10
  cancel-in-progress: false

jobs:
  validate:
    name: Tests and full original-jazz production render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out public validation controller
        uses: actions/checkout@v4

      - name: Check out private agent PR branch
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: feature/original-arrangement-development
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact private-agent revision under test
        working-directory: agent
        run: |
          echo "Agent revision:"
          git rev-parse HEAD
          echo "Commit message:"
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python files
        working-directory: agent
        run: python -m compileall -q .

      - name: Report the composed melody design
        working-directory: agent
        run: |
          python - <<'PY'
          import original_music
          print(f"Melodic cells: {len(original_music.MELODY_CELLS)}")
          print(f"Sections: {len(original_music.SECTION_PROGRESSIONS)}")
          print("Phrase structure: call / answer / variation / cadence")
          assert len(original_music.MELODY_CELLS) >= 4
          assert callable(original_music.melody_phrase_events)
          PY

      - name: Run complete unit test suite, including long-form listening profile
        working-directory: agent
        run: python -m unittest discover -s tests -v

      - name: Run real FFmpeg synthetic video self-test
        working-directory: agent
        run: python main.py self-test

      - name: Render the complete original jazz suite as a 25-minute MP4
        working-directory: agent
        run: python main.py make-original --hours 0.4162603 --bpm 82 --seed 20261109

      - name: Verify production MP4 streams and duration
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find output -type f -name video.mp4 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels -of json "$VIDEO" > production-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("production-probe.json").read_text())
          duration = float(data["format"]["duration"])
          streams = data["streams"]
          assert 1490 <= duration <= 1505, f"Unexpected render duration: {duration}"
          video = next(s for s in streams if s["codec_type"] == "video")
          audio = next(s for s in streams if s["codec_type"] == "audio")
          assert video["codec_name"] == "h264", video
          assert (video["width"], video["height"]) == (1920, 1080), video
          assert audio["codec_name"] == "aac" and audio["channels"] == 2, audio
          print(f"PASS: {duration:.2f}s H.264 1920x1080 + AAC stereo")
          print(f"File size: {data['format']['size']} bytes")
          PY
          echo "Render validado en el runner; no se publica como artifact en el repositorio público."
          rm -f "$VIDEO" production-probe.json
          find tracks/generated/original -maxdepth 1 -type f \( -name '*.json' -o -name '*.wav' \) -delete

      - name: Confirm no publishing or Drive writes
        run: |
          echo "Production render only: no YouTube credentials, upload, Google Drive restore, or Drive push."
