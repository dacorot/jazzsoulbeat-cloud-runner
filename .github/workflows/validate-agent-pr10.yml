name: Validate Jazz Soul Beat agent PR #10
# Re-triggered after JSB logo watermark integration on the private agent branch.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-agent-pr10.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jazzsoulbeat-pr10
  cancel-in-progress: false

jobs:
  validate:
    name: Compile, unit tests, and FFmpeg self-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out public validation controller
        uses: actions/checkout@v4

      - name: Check out private agent PR branch
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: feature/original-arrangement-development
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python files
        working-directory: agent
        run: python -m compileall -q .

      - name: Run complete unit test suite
        working-directory: agent
        run: python -m unittest discover -s tests -v

      - name: Run real FFmpeg synthetic video self-test
        working-directory: agent
        run: python main.py self-test

      - name: Confirm no publishing or cloud writes
        run: |
          echo "Validation only: no YouTube credentials, upload, Google Drive restore, or Drive push."
