name: Jazz Soul Beat - Visual production batch

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Visual category to produce"
        required: true
        default: midnight_jazz_soul
        type: choice
        options:
          - midnight_jazz_soul
          - coffee_smooth_jazz
          - soulful_blues
          - christian_jazz_gospel
      count:
        description: "Scenes in this free batch"
        required: true
        default: "8"
        type: choice
        options:
          - "1"
          - "4"
          - "8"
  schedule:
    - cron: "0 4 * * *"
  push:
    paths:
      - ".github/workflows/visual-production-batch.yml"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-visual-production
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'midnight_jazz_soul' }}
      COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || '8' }}
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4

      - name: Checkout private visual producer
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install visual producer dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Restore private visual state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set +e
          timeout 300s python main.py drive-pull
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Drive restore did not finish; continuing with a clean visual workspace."
          fi
          exit 0

      - name: Produce original visual batch
        working-directory: agent
        env:
          CATEGORY: ${{ env.CATEGORY }}
          COUNT: ${{ env.COUNT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scene_factory import generate_scene_library

          category = os.environ["CATEGORY"]
          count = int(os.environ["COUNT"])
          result = generate_scene_library(count=count, category=category)
          summary = {
              "category": category,
              "requested": count,
              "generated": result.get("scene_count_generated", 0),
              "original": result.get("scene_count_original", 0),
              "derived": result.get("scene_count_derived", 0),
              "status": result.get("status"),
              "failure": result.get("failure"),
              "publication": "NOT_APPROVED",
          }
          out = Path("output/visual-scenes") / "latest-batch-summary.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary["generated"] == 0:
              raise SystemExit("No visual scene was generated; batch failed closed.")
          PY

      - name: Run Brand Guardian checks
        working-directory: agent
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_visual_contract.py tests/test_visual_directors.py tests/test_scene_factory.py
          python - <<'PY'
          import json
          from pathlib import Path
          from visual_contract import validate_batch_manifest
          root = Path("assets/visual-agents") / "${{ env.CATEGORY }}" / "scenes"
          manifest_path = root / "SCENE_MANIFEST.json"
          if not manifest_path.is_file():
              raise SystemExit(f"Generated visual manifest missing: {manifest_path}")
          report = validate_batch_manifest(
              json.loads(manifest_path.read_text(encoding="utf-8")),
              scene_root=root,
              minimum_scenes=1,
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Persist visual batch privately
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          timeout 300s python main.py drive-push-visual-assets
          timeout 300s python main.py drive-push-qa
          timeout 120s python main.py drive-status

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-production-${{ github.run_id }}
          path: |
            agent/output/visual-scenes/latest-batch-summary.json
            agent/output/visual-scenes/SCENE_GENERATION_REPORT.md
          if-no-files-found: warn
          retention-days: 14
