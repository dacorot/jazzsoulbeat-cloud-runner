name: Jazz Soul Beat - Telegram approval poll

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-telegram-approval
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID != '' && secrets.DRIVE_TOKEN_JSON != '' && secrets.PRIVATE_REPO_READ_TOKEN != '' }}
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4

      - name: Safely skip when Telegram/Drive secrets are not configured
        if: ${{ env.TELEGRAM_CONFIGURED != 'true' }}
        run: echo "No Telegram approval poll executed; required secrets are not configured."

      - name: Checkout private agent
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Install private agent dependencies
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore private state and approval ledger
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull-state
          python main.py drive-pull-original-music
          python main.py drive-pull-telegram-state

      - name: Process bounded Telegram callbacks
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID: ${{ secrets.JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID }}
          PYTHONPATH: ..
        run: |
          ledger="$(find output/original-music -type f -name approval_ledger.json | sort | tail -1)"
          if [[ -z "$ledger" ]]; then
            echo "No pending original-music review ledger found; no callback processed."
            exit 0
          fi
          offset="output/telegram/approval-offset.txt"
          python ../scripts/telegram_approval.py poll-once --ledger "$ledger" --offset-file "$offset"

      - name: Persist updated ledger and Telegram offset
        if: ${{ env.TELEGRAM_CONFIGURED == 'true' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-state
          python main.py drive-push-original-music
          python main.py drive-push-telegram-state
