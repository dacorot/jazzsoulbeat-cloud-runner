name: Jazz Soul Beat - Integration Safety and Original Music QA
# Revalidate complete packages, explicit seed constraints, encoder crashes, corrupt audio, and network outage.
# QA also verifies owner-rejected SHA cannot enter mixes, and public publication stays denied.
# Only short synthetic QA checks; never expose audio artifacts from this public repository.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/qa-original-integration.yml
permissions:
  contents: read
concurrency:
  group: jazz-soul-beat-qa-original-integration
  cancel-in-progress: false
jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private integrated agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: integration/longform-original-qhd-v1
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free dependencies
        working-directory: agent
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r requirements.txt
      - name: Compile and run all regression tests
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Render and validate a 16-bar original smoke audition
        working-directory: agent
        run: |
          python original_review.py --bars 16 --bpm 82 --seed 20261114 --output output/qa-r1-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/qa-r1-smoke/ORIGINAL_REVIEW_REPORT.json")
          assert p.is_file()
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["bars"] == 16
          assert r["creative_approval"] is False
          assert r["can_publish"] is False
          assert r["youtube_upload"] == "NOT_ATTEMPTED"
          assert 40 <= float(r["duration_seconds"]) <= 60
          assert Path("output/qa-r1-smoke/original-jazz-audition.mp3").stat().st_size > 100000
          print("SMOKE PASS: stereo original audio and all publish gates closed.")
          PY
      - name: Confirm procedural synth is never a release candidate and public publishing is denied
        working-directory: agent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/qa-r1-smoke/ORIGINAL_REVIEW_REPORT.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] == "REJECTED_PROCEDURAL_AUDIO_TECHNICAL_FIXTURE"
          assert r["editorial_verdict"] == "REJECTED_FOR_RELEASE"
          assert r["eligible_for_video_assembly"] is False
          assert r["creative_approval"] is False
          assert r["can_publish"] is False
          print("PASS: synthetic technical fixture is not a publication candidate.")
          PY
      - name: State non-publication boundary
        if: always()
        run: |
          echo "## QA Round 1: ORIGINAL MUSIC AUDITION ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "No Telegram action, YouTube upload, public publication, paid provider or automatic rights approval was attempted." >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic audio remains rejected; smoke test discarded with the ephemeral runner. No public artifact is created." >> "$GITHUB_STEP_SUMMARY"
