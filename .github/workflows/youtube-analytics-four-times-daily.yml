name: YouTube Analytics snapshots and learning

on:
  schedule:
    # Four daily observations in UTC; GitHub may start scheduled jobs late.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Fetch read-only analytics and generate learning feedback
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          END_DATE=$(date -u +%F)
          python youtube_analytics.py --all-recent --days 7 --end-date "$END_DATE" --output-dir output/youtube-analytics
      - name: Persist private analytics snapshots
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-qa
          python main.py drive-status
      - name: Confirm no publication action
        run: echo "Analytics only: no upload, title edit, thumbnail edit or publication was performed."
