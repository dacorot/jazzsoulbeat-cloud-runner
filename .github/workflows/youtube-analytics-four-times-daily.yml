name: YouTube Analytics snapshots and learning

on:
  schedule:
    # Four daily observations in UTC; GitHub may start scheduled jobs late.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt
      - name: Fetch read-only analytics and generate learning feedback
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set +e
          END_DATE=$(date -u +%F)
          mkdir -p output/youtube-analytics
          python youtube_analytics.py --all-recent --days 7 --end-date "$END_DATE" --output-dir output/youtube-analytics 2>&1 | tee output/youtube-analytics/analytics-run.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python - "$END_DATE" "$code" <<'PY'
          import json, sys
          from pathlib import Path
          end_date, code = sys.argv[1], int(sys.argv[2])
          Path("output/youtube-analytics/ANALYTICS_BLOCKED.json").write_text(
              json.dumps({
                  "status": "BLOCKED_ANALYTICS_API",
                  "observed_end_date": end_date,
                  "exit_code": code,
                  "message": "YouTube Analytics API is unavailable or disabled for the configured Google Cloud project.",
                  "action_required": "Enable youtubeanalytics.googleapis.com in Google Cloud project 1037178008003, then wait for propagation.",
                  "publication": "NO_UPLOAD_OR_METADATA_CHANGE",
              }, indent=2) + "\n", encoding="utf-8"
          )
          PY
            echo "::warning::YouTube Analytics API is unavailable; a blocked diagnostic was persisted and no publication action occurred."
          fi
          exit 0
      - name: Persist private analytics snapshots
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push-qa
          python main.py drive-status
      - name: Confirm no publication action
        run: |
          echo "Analytics only: no upload, title edit, thumbnail edit or publication was performed."
