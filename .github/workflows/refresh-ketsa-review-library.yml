name: Refresh private Ketsa jazz-soul review library
# Build the first eight eligible full-length candidate previews (over 3 minutes each, up to 6 minutes) with 18-second equal-power crossfades; normalize scene backgrounds and render 2560x1440 2K QHD; validate private-only package and exact rejected-output pruning.

# Refresh trigger: rebuild cached Ketsa audition and expose track-level audit diagnostics from the private agent.
on:
  schedule:
    - cron: "30 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: jazzsoulbeat-ketsa-library-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Discover, stage and privately back up Ketsa candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact agent revision
        id: agent_revision
        working-directory: agent
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg for private audition rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies and validate the complete agent test suite
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Restore only existing Ketsa review audio from private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull-ketsa-review
          python main.py drive-status

      - name: Rebuild official Ketsa candidate list and reuse or download exact review files
        timeout-minutes: 45
        working-directory: agent
        run: |
          python main.py download-ketsa --limit 100
          python -c 'import csv; from pathlib import Path; p=Path("output/ketsa_candidates.csv"); rows=list(csv.DictReader(p.open(newline="", encoding="utf-8-sig"))); print("Ketsa candidates staged:", len(rows)); print("Owner-selected titles:", [(r.get("selection_order"), r.get("title"), r.get("duration_seconds") or "duration pending") for r in rows if r.get("previous_user_selection") == "yes"]); assert len(rows) > 0; assert all(r.get("source_url") and r.get("download_url") for r in rows)'
          python main.py build-ketsa-review-pack --seconds 360 --theme evergreen --crossfade 18
          python rights_audit.py ketsa

      - name: Persist review-only candidates and receipts in private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Require complete Ketsa rights audit
        working-directory: agent
        run: |
          test -s output/ketsa-review/KETSA_RIGHTS_AUDIT.csv
          test -s output/ketsa-review/KETSA_AUDITION_RIGHTS.csv
          test -s output/ketsa-review/KETSA_RIGHTS_EVIDENCE.json
          echo "PASS: Ketsa license, track-page, file-provenance and audition-shortlist reports are present."
          echo "PASS: no rights approval, library mutation or public publication was performed."

      - name: Preserve private audition and evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-ketsa-review-package
          path: |
            agent/output/ketsa-review/*
            agent/tracks/review/ketsa/download_receipt.json
            agent/output/ketsa_candidates.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm publication safety
        run: |
          echo "Review-library refresh only: no YouTube OAuth, no upload, no scheduling, no public publication, no paid service."

      - name: Record Ketsa audit result on commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=success
          if [ "$RESULT" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="Jazz Soul Beat / Ketsa audit" \
            -f description="Ketsa audit workflow: $RESULT; rights approval flags untouched."


# Refresh trigger: corrected audit uses stable Ketsa download IDs and records a commit status.

# Trigger corrected stable-download-ID Ketsa rights audit after the audit-code fix.
