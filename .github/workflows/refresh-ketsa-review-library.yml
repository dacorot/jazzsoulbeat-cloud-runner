name: Refresh private Ketsa jazz-soul review library
# Build the first eight eligible full-length candidate previews (over 3 minutes each, up to 6 minutes) with 18-second equal-power crossfades; normalize scene backgrounds and render 2560x1440 2K QHD; validate private-only package and exact rejected-output pruning.

# Refresh trigger: rebuild cached Ketsa audition with the Drive HTTP 308 resumable-progress fix, multipart small uploads and mature anime guidance.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-ketsa-review-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazzsoulbeat-ketsa-library-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Discover, stage and privately back up Ketsa candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact agent revision
        id: agent_revision
        working-directory: agent
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg for private audition sampler
        timeout-minutes: 12
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check ffmpeg-downloader==0.5.3
            python -m ffmpeg_downloader install @gpl
            FFMPEG_BIN_DIR="$(python -c 'import ffmpeg_downloader as f; from pathlib import Path; p=Path(f.ffmpeg_path); q=Path(f.ffprobe_path); assert p.is_file(), p; assert q.is_file(), q; print(p.parent)')"
            echo "$FFMPEG_BIN_DIR" >> "$GITHUB_PATH"
            echo "Verified FFmpeg directory: $FFMPEG_BIN_DIR"
          else
            echo "Using FFmpeg already present on the GitHub-hosted runner."
          fi
          command -v ffmpeg
          ffmpeg -version | head -n 2
          command -v ffprobe
          ffprobe -version | head -n 2

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore only existing Ketsa review audio from private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull-ketsa-review
          python main.py drive-status

      - name: Rebuild the private audition from cached, source-audited Ketsa candidates
        timeout-minutes: 25
        working-directory: agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JSB_AGENT_REVISION: ${{ steps.agent_revision.outputs.sha }}
        run: |
          test -s output/ketsa_candidates.csv
          test -d tracks/review/ketsa
          python main.py build-ketsa-review-pack --seconds 360 --theme evergreen --crossfade 18
          python -c 'import csv; from pathlib import Path; p=Path("output/ketsa_candidates.csv"); rows=list(csv.DictReader(p.open(newline="", encoding="utf-8-sig"))); individual=[r for r in rows if r.get("intake_type")=="individual_track_candidate" and r.get("file") and "PENDING" in (r.get("review_status") or "").upper()]; print(f"Cached candidates: {len(rows)}; pending individual tracks: {len(individual)}")'

      - name: Persist review-only candidates and receipts in private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Require complete private audition package
        working-directory: agent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/ketsa-review")
          required = (
              root / "KETSA_CANDIDATE_AUDITION.mp3",
              root / "KETSA_AUDITION_INDEX.csv",
              root / "KETSA_AUDITION_README.txt",
              root / "KETSA_CANDIDATE_AUDITION_REVIEW_ONLY.mp4",
              root / "KETSA_AUDITION_VIDEO_PROVENANCE.json",
          )
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("Incomplete audition package: " + ", ".join(missing))
          provenance = json.loads(required[-1].read_text(encoding="utf-8"))
          if provenance.get("review_video", {}).get("status") != "created":
              raise SystemExit("Review MP4 is not confirmed as created.")
          if int(provenance.get("candidate_count", 0)) < 1:
              raise SystemExit("No Jazz Soul Beat candidates were included in the audition.")
          print("PASS: sampler, index, README, animated MP4 and provenance are present.")
          print("PASS: all assets remain private audition material; no rights approval or publication.")
          PY

      - name: Confirm publication safety
        run: |
          echo "Review-library refresh only: no YouTube OAuth, no upload, no scheduling, no public publication, no paid service."
