name: Refresh private Ketsa jazz-soul review library
# Build the private timestamped audition sampler and animated review MP4 before Drive backup; Ketsa taxonomy tags enrich style, mood and instrument metadata; no approval or publication.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-ketsa-review-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazzsoulbeat-ketsa-library-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Discover, stage and privately back up Ketsa candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact agent revision
        id: agent_revision
        working-directory: agent
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg for private audition sampler
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore only existing Ketsa review audio from private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull-ketsa-review
          python main.py drive-status

      - name: Discover and download up to 40 best-matching Ketsa tracks
        working-directory: agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JSB_AGENT_REVISION: ${{ steps.agent_revision.outputs.sha }}
        run: |
          python main.py download-ketsa --limit 40
          python main.py build-ketsa-review-pack --seconds 25
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("output/ketsa_candidates.csv")
          with path.open(newline="", encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          print(f"Candidates staged: {len(rows)}")
          for row in rows[:20]:
              print(f"{row.get('priority_score','0'):>3} | {row.get('title','')} | {row.get('genres','')[:110]}")
          individual = [row for row in rows
                        if row.get("intake_type") == "individual_track_candidate"
                        and row.get("file") and "PENDING" in (row.get("review_status") or "").upper()]
          duration = sum(float(row.get("duration_seconds") or 0) for row in individual)
          with_instruments = sum(bool((row.get("instruments") or "").strip()) for row in individual)
          rights_verified = sum((row.get("rights_verified") or "").strip().lower() == "yes" for row in individual)
          print(f"Downloaded/present individual candidates: {len(individual)}")
          print(f"Candidate source-audio duration: {duration/60:.1f} minutes")
          print(f"Explicit instrument tags from Ketsa: {with_instruments}/{len(individual)}")
          print(f"Candidates with full rights verification: {rights_verified}/{len(individual)}")
          print("All candidates remain pending; none is approved for publication.")
          PY

      - name: Persist review-only candidates and receipts in private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Confirm publication safety
        run: |
          echo "Review-library refresh only: no YouTube OAuth, no upload, no scheduling, no public publication, no paid service."
