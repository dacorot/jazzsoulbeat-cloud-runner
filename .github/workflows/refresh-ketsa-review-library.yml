name: Refresh private Ketsa jazz-soul review library

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-ketsa-review-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazzsoulbeat-ketsa-library-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Discover, stage and privately back up Ketsa candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Record exact agent revision
        working-directory: agent
        run: |
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore private review library from Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-pull
          python main.py drive-status

      - name: Discover and download up to 40 best-matching Ketsa tracks
        working-directory: agent
        run: |
          python main.py download-ketsa --limit 40
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("output/ketsa_candidates.csv")
          with path.open(newline="", encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          print(f"Candidates staged: {len(rows)}")
          for row in rows[:20]:
              print(f"{row.get('priority_score','0'):>3} | {row.get('title','')} | {row.get('genres','')[:110]}")
          print("All candidates remain pending; none is approved for publication.")
          PY

      - name: Persist review-only candidates and receipts in private Google Drive
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Confirm publication safety
        run: |
          echo "Review-library refresh only: no YouTube OAuth, no upload, no scheduling, no public publication, no paid service."
