name: Jazz Soul Beat - Schedule approved YouTube publication

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Exact private YouTube video ID"
        required: true
        type: string
      artifact_sha256:
        description: "SHA-256 of the exact approved MP4"
        required: true
        type: string
      approval_id:
        description: "Hash-bound schedule_publication approval ID"
        required: true
        type: string
      publish_at_utc:
        description: "UTC publication time, ISO-8601 ending in Z"
        required: true
        type: string
      agent_ref:
        description: "Private agent branch or full commit SHA"
        required: true
        default: fix/real-music-and-cinematic-motion
        type: string

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-publication-${{ inputs.video_id }}
  cancel-in-progress: false

jobs:
  schedule:
    name: Validate exact approval and schedule one private video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_ID: ${{ inputs.video_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      APPROVAL_ID: ${{ inputs.approval_id }}
      PUBLISH_AT_UTC: ${{ inputs.publish_at_utc }}
      AGENT_REF: ${{ inputs.agent_ref }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4

      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{6,32}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]]
          [[ "$PUBLISH_AT_UTC" == *T*Z ]]
          [[ -n "$AGENT_REF" && "$AGENT_REF" != *..* && "$AGENT_REF" != */ && "$AGENT_REF" != *//* ]]

      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: ${{ env.AGENT_REF }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install private agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore hash-bound approval state and private upload receipt
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull-state

      - name: Schedule exact approved private video
        working-directory: agent
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python schedule_publication.py \
            --video-id "$VIDEO_ID" \
            --artifact-sha256 "${ARTIFACT_SHA256,,}" \
            --approval-id "$APPROVAL_ID" \
            --publish-at-utc "$PUBLISH_AT_UTC"

      - name: Persist publication receipt and audit state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-state
