name: Jazz Soul Beat - Notify existing delivery reviews

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-shared-private-drive-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_REVIEWER_ID != '' && secrets.JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID != '' && secrets.DRIVE_TOKEN_JSON != '' && secrets.PRIVATE_REPO_READ_TOKEN != '' }}
    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v4

      - name: Stop clearly when required secrets are absent
        if: ${{ env.TELEGRAM_CONFIGURED != 'true' }}
        run: |
          echo "Required Telegram/Drive/private-agent secrets are not configured."
          exit 1

      - name: Checkout private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Install private agent dependencies
        working-directory: agent
        run: python -m pip install -r requirements.txt

      - name: Restore private delivery state
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-pull-state

      - name: Create hash-bound review requests
        id: prepare_reviews
        run: |
          manifest="agent/tracks/generated/jazz-only-10-videos-2026-11-22/delivery-manifest.json"
          if [[ ! -s "$manifest" ]]; then
            mkdir -p agent/output/original-music/delivery-video-reviews
            printf '{"request_ids":[],"status":"NO_DELIVERY_MANIFEST"}\n' > agent/output/original-music/delivery-video-reviews/review-plan.json
            printf '{"requests":[],"status":"NO_DELIVERY_MANIFEST"}\n' > agent/output/original-music/delivery-video-reviews/approval_ledger.json
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "No delivery manifest exists yet; notification cycle remains idle."
            exit 0
          fi
          python scripts/prepare_delivery_video_reviews.py \
            --manifest "$manifest" \
            --agent-root agent \
            --ledger agent/output/original-music/delivery-video-reviews/approval_ledger.json \
            --plan agent/output/original-music/delivery-video-reviews/review-plan.json
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram with private review instructions
        if: ${{ steps.prepare_reviews.outputs.prepared == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID: ${{ secrets.JAZZ_SOUL_BEAT_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan = json.loads(Path('agent/output/original-music/delivery-video-reviews/review-plan.json').read_text())
          for request_id in plan['request_ids']:
              subprocess.run([
                  'python', 'scripts/notify_delivery_video_review.py',
                  '--ledger', 'agent/output/original-music/delivery-video-reviews/approval_ledger.json',
                  '--request-id', request_id,
              ], check=True)
          PY

      - name: Persist review ledger privately
        if: ${{ steps.prepare_reviews.outputs.prepared == 'true' }}
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: python main.py drive-push-original-music

