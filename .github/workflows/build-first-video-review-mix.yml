name: Build private first-hour Jazz review mix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-first-video-review-mix.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize with the Incompetech refresh so both jobs never write the same Drive tree concurrently.
concurrency:
  group: jazz-soul-beat-incompetech-review-refresh
  cancel-in-progress: false

jobs:
  build-review-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cloud controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Check out private Jazz Soul Beat agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent

      - name: Record exact agent revision
        working-directory: agent
        run: |
          git rev-parse HEAD
          git log -1 --pretty=%s

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies and free media tools
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 2

      - name: Run complete private-agent test suite
        working-directory: agent
        run: |
          python -m compileall -q .
          python -m pytest -q tests

      - name: Start PDCA cycle for first-hour private music review
        id: pdca_start
        uses: ./controller/.github/actions/pdca-start
        with:
          task: first-video-private-jazz-review-mix
          objective: Build a one-hour private Jazz-only review mix from exact official Incompetech files without approving rights or publishing
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: Restore stored anime visual candidate from private Drive for inspection
        id: visual_reference
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from drive_storage import DriveStore
          relative = "output/ketsa-review/KETSA_AUDITION_BACKGROUND.jpg"
          store = DriveStore.from_token_json(os.environ["DRIVE_TOKEN_JSON"])
          result = store.pull(paths=(relative,))
          image = Path(relative)
          if not image.is_file() or image.stat().st_size == 0:
              raise RuntimeError("Stored visual candidate was not restored.")
          digest = hashlib.sha256(image.read_bytes()).hexdigest()
          print({"restored": result, "path": relative, "bytes": image.stat().st_size, "sha256": digest})
          PY

      - name: Rebuild exact official Jazz candidate files and rights evidence
        id: source_audit
        timeout-minutes: 45
        working-directory: agent
        run: |
          python main.py discover-incompetech
          python main.py audit-incompetech-sources
          python main.py download-incompetech
          python rights_audit.py incompetech

      - name: Build one-hour review-only Jazz mix with no repeated tracks
        id: review_mix
        timeout-minutes: 30
        working-directory: agent
        run: |
          python incompetech_review_mix.py
          test -s output/first-video-review/INCOMPETECH_JAZZ_FIRST_HOUR_REVIEW_ONLY.mp3
          test -s output/first-video-review/MUSIC_SOURCE_REVIEW_ONLY.txt
          test -s output/first-video-review/REVIEW_MIX_PROVENANCE.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/first-video-review/REVIEW_MIX_PROVENANCE.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["mix_duration_seconds"] == 3600.0
          assert data["rights_verified_count"] == 0
          assert data["youtube_upload"] == "not attempted"
          assert data["drive_visibility"] == "private"
          print("PASS: exactly one hour; review-only; no rights approval; no YouTube upload.")
          print("Tracks:", data["track_count"])
          print("SHA-256:", data["mix_sha256"])
          PY

      - name: Persist private review mix and provenance to Google Drive
        id: persist
        working-directory: agent
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          python main.py drive-push
          python main.py drive-status

      - name: Upload compact private review artifact
        if: ${{ always() && steps.review_mix.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jazz-soul-beat-first-hour-review-mix
          path: |
            agent/output/first-video-review/*
            agent/output/ketsa-review/KETSA_AUDITION_BACKGROUND.jpg
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_AUDIT.csv
            agent/output/incompetech-rights/INCOMPETECH_RIGHTS_EVIDENCE.json
            agent/output/incompetech_candidates.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm no approval or publication occurred
        if: always()
        run: |
          echo "Private review mix only. Rights remain pending; no library approval, YouTube upload, or public publication."

      - name: Verify and close PDCA cycle
        if: ${{ always() && steps.pdca_start.outcome == 'success' }}
        uses: ./controller/.github/actions/pdca-finish
        with:
          cycle_id: ${{ steps.pdca_start.outputs.cycle_id }}
          result_json: '{"workflow":"first-video-private-jazz-review-mix","run_id":"${{ github.run_id }}","job_status":"${{ job.status }}"}'
          checks_json: >-
            [{"name":"complete_agent_tests","passed":${{ steps.source_audit.outcome == 'success' }}},{"name":"one_hour_review_mix","passed":${{ steps.review_mix.outcome == 'success' }}},{"name":"private_drive_persistence","passed":${{ steps.persist.outcome == 'success' }}},{"name":"no_automatic_rights_approval","passed":true},{"name":"no_youtube_publication","passed":true}]
          evidence: 'GitHub Actions run ${{ github.run_id }}; one-hour Jazz review mix, exact source manifest and rights evidence'
          drive_token_json: ${{ secrets.DRIVE_TOKEN_JSON }}
