name: Jazz Soul Beat development agents supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - ".github/workflows/development-agents-supervisor.yml"
      - "config/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: jazz-soul-beat-development-agents
  cancel-in-progress: false

jobs:
  review:
    name: development-agent-${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: music-rights
            tests: "tests/test_incompetech_catalog.py tests/test_incompetech_download.py tests/test_incompetech_review.py tests/test_incompetech_source_audit.py tests/test_incompetech_track_pages.py tests/test_incompetech_rights_audit.py tests/test_library.py"
          - role: visual-contracts
            tests: "tests/test_scene_factory.py tests/test_visual_directors.py tests/test_multi_scene_video.py tests/test_main_scene_assets.py"
          - role: publication-metadata
            tests: "tests/test_metadata_profile.py tests/test_youtube_upload.py tests/test_publication_idempotency.py tests/test_release_coordinator.py"
          - role: autonomy-pdca
            tests: "tests/test_autonomy.py tests/test_pdca.py tests/test_agent_memory.py tests/test_drive_storage.py"
          - role: safety-boundaries
            tests: "tests/test_drive_auth.py tests/test_drive_storage.py tests/test_rights_audit.py tests/test_licenses.py"
          - role: integration
            tests: "tests"

    steps:
      - name: Check out private agent
        uses: actions/checkout@v4
        with:
          repository: dacorot/jazzsoulbeat-agent
          ref: fix/real-music-and-cinematic-motion
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run bounded development-agent review
        working-directory: agent
        env:
          ROLE: ${{ matrix.role }}
          TESTS: ${{ matrix.tests }}
        run: |
          set +e
          mkdir -p output/development-agents
          {
            echo "role=$ROLE"
            echo "run_id=${{ github.run_id }}"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tests=$TESTS"
            python -m pytest -q $TESTS
            code=$?
            echo "exit_code=$code"
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit $code
          } 2>&1 | tee "output/development-agents/${ROLE}.log"
          exit ${PIPESTATUS[0]}

      - name: Upload development-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-agent-${{ matrix.role }}-${{ github.run_id }}
          path: agent/output/development-agents/${{ matrix.role }}.log
          if-no-files-found: warn
          retention-days: 14
